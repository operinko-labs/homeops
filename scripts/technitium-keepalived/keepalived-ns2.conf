! /etc/keepalived/keepalived.conf on ns2 (LXC 100, NUC, 192.168.5.9)
!
! Identical to ns1 apart from state, priority and the unicast addresses.
! auth_pass must match ns1 exactly or the two will not see each other.

global_defs {
    router_id ns2

    enable_script_security
    script_user root
}

vrrp_script chk_technitium {
    script "/etc/keepalived/check-technitium-dns.sh"
    interval 5
    timeout 3
    rise 2
    fall 2
    ! Harmless here: 100 - 60 = 40 is still below ns1's 150, so a failing check
    ! on the backup changes nothing. It matters only if ns1 is already down,
    ! where it correctly stops ns2 claiming a VIP it cannot serve.
    weight -60
}

vrrp_instance DNS_VIP {
    state BACKUP
    interface eth1
    virtual_router_id 53
    priority 100
    advert_int 1

    unicast_src_ip 192.168.5.9
    unicast_peer {
        192.168.5.8
    }

    authentication {
        auth_type PASS
        auth_pass CHANGEME
    }

    virtual_ipaddress {
        192.168.5.7/24 dev eth1
    }

    track_script {
        chk_technitium
    }
}
