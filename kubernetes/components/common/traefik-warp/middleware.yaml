---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-warp
spec:
  plugin:
    traefikwarp:
      # Cloudflare only. Every instance fetches its provider's CIDR lists
      # synchronously when Traefik builds it, and Traefik rebuilds every
      # router's middlewares on each config reload. `auto` also fetched the
      # CloudFront list (~2s each, a CDN nothing here uses), so the ~12 routers
      # using this middleware held each reload for ~25s: after a pod
      # restart Traefik kept routing to the dead pod IP (502), then to no
      # server at all (503), for up to a minute.
      provider: cloudflare
      # Automatically refresh CDN CIDR ranges
      autoRefresh: true
      # Refresh interval (default: 12h, using 24h for less overhead)
      refreshInterval: 24h
      # Enable debug logging for initial testing
      debug: false
      # Extend trusted IPs beyond the official CDN ranges.
      #
      # cloudflared connects to Traefik over the in-cluster Service, so the
      # socket IP Traefik sees is cloudflared's *pod* IP, never one of
      # Cloudflare's published edge ranges. The plugin validates the socket IP,
      # so without this every tunnelled request was marked X-Warp-Trusted=no and
      # had its X-Real-Ip overwritten with the pod IP — CF-Connecting-IP, which
      # carries the genuine visitor address, was discarded. Every app, and
      # Authentik, therefore saw 10.42.x.x for all external traffic.
      #
      # The key is `trustip` (lowercase) to match the plugin's struct tag, and
      # the provider key must be the lowercase provider name.
      #
      # This trusts any pod that can reach Traefik to assert CF-Connecting-IP.
      # That is acceptable here because a pod with that access can already reach
      # backend Services directly on their ClusterIP, bypassing Traefik and its
      # auth entirely — so it grants no capability an attacker wouldn't have.
      trustip:
        cloudflare:
          - "10.42.0.0/16"

