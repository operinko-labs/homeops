---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrelease.yaml
  - rbac.yaml
  - rbac-ns.yaml
  - secret.sops.yaml
  - ocirepository.yaml
  - grafanadashboard.yaml
  - external-secret-oidc.yaml
configMapGenerator:
  # Fail-closed replacement for traefik-warp's Cloudflare range fetch; the
  # plugin-loader initContainer copies it in (see helmrelease.yaml).
  - name: traefik-warp-patch
    files:
      - cloudflare.go=warp-cloudflare.go
generatorOptions:
  disableNameSuffixHash: true
