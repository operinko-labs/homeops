---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: network
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: traefik
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    gateway:
      enabled: false
    gatewayClass:
      enabled: false
    deployment:
      priorityClassName: system-cluster-critical
      replicas: 4
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 2
          maxUnavailable: 0
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
      initContainers:
        - name: plugin-loader
          image: alpine:3.24
          command: ["sh", "-c"]
          args:
            - |
              set -e
              # renovate: datasource=github-releases depName=xabinapal/traefik-authentik-forward-plugin
              AUTH_VER=v1.0.1
              # renovate: datasource=github-releases depName=l4rm4nd/traefik-warp
              WARP_VER=v1.1.5
              # renovate: datasource=github-releases depName=sevensolutions/traefik-oidc-auth
              OIDC_VER=v0.21.0
              AUTH_DIR=/plugins-local/src/github.com/xabinapal/traefik-authentik-forward-plugin
              WARP_DIR=/plugins-local/src/github.com/l4rm4nd/traefik-warp
              OIDC_DIR=/plugins-local/src/github.com/sevensolutions/traefik-oidc-auth
              mkdir -p "$AUTH_DIR"
              wget -qO- "https://github.com/xabinapal/traefik-authentik-forward-plugin/archive/$AUTH_VER.tar.gz" \
                | tar xz -C "$AUTH_DIR" --strip-components=1
              mkdir -p "$WARP_DIR"
              wget -qO- "https://github.com/l4rm4nd/traefik-warp/archive/$WARP_VER.tar.gz" \
                | tar xz -C "$WARP_DIR" --strip-components=1
              mkdir -p "$OIDC_DIR"
              wget -qO- "https://github.com/sevensolutions/traefik-oidc-auth/archive/$OIDC_VER.tar.gz" \
                | tar xz -C "$OIDC_DIR" --strip-components=1
          volumeMounts:
            - name: plugins-local
              mountPath: /plugins-local
      additionalVolumes:
        - name: plugins-local
          emptyDir: {}
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 1000m
        memory: 512Mi
    envFrom:
      - secretRef:
          name: traefik-oidc-secret
    additionalArguments:
      - --api.insecure=true
      - --api.dashboard=true
      - --serversTransport.maxIdleConnsPerHost=100
      - --entryPoints.websecure.transport.respondingTimeouts.readTimeout=60s
      - --entryPoints.websecure.transport.respondingTimeouts.writeTimeout=60s
      - --entryPoints.websecure.transport.respondingTimeouts.idleTimeout=180s

    providers:
      kubernetesIngress:
        enabled: false
        namespaces: []
      kubernetesGateway:
        enabled: true
      kubernetesCRD:
        enabled: true
    api:
      dashboard: true
      insecure: true
    log:
      level: INFO
    accessLog:
      enabled: true
      format: json
      fields:
        defaultMode: keep
        names:
          ClientUsername: drop
        headers:
          defaultMode: keep
          names:
            Authorization: drop
            User-Agent: keep
            CF-Connecting-IP: keep
            X-Forwarded-For: keep
            X-Real-IP: keep
            X-Forwarded-Host: keep
            X-Forwarded-Port: keep
            X-Forwarded-Proto: keep
    experimental:
      localPlugins:
        authentik-forward:
          moduleName: "github.com/xabinapal/traefik-authentik-forward-plugin"
          type: localPath
          mountPath: /plugins-local/src/github.com/xabinapal/traefik-authentik-forward-plugin
          volumeName: plugins-local
          subPath: src/github.com/xabinapal/traefik-authentik-forward-plugin
        traefikwarp:
          moduleName: "github.com/l4rm4nd/traefik-warp"
          type: localPath
          mountPath: /plugins-local/src/github.com/l4rm4nd/traefik-warp
          volumeName: plugins-local
          subPath: src/github.com/l4rm4nd/traefik-warp
        traefik-oidc-auth:
          moduleName: "github.com/sevensolutions/traefik-oidc-auth"
          type: localPath
          mountPath: /plugins-local/src/github.com/sevensolutions/traefik-oidc-auth
          volumeName: plugins-local
          subPath: src/github.com/sevensolutions/traefik-oidc-auth
    service:
      enabled: true
      type: LoadBalancer
      labels:
        io.cilium/ipam: static
      annotations:
        lbipam.cilium.io/ips: "192.168.7.4"
      # `externalTrafficPolicy: Local` used to sit here and never did anything:
      # this chart takes no such value, it splices service.spec through into the
      # Service verbatim, so the correct path would be service.spec.external-
      # TrafficPolicy. The live Service has always read Cluster.
      #
      # It is deliberately not being corrected-and-enabled. Local exists to
      # preserve the client source IP, and Cilium already does that here via
      # bpf-lb-mode=dsr — LAN clients arrive at Traefik with their real address
      # intact today. Switching to Local would buy nothing and would restrict
      # BGP advertisement of the VIP to only those nodes currently holding a
      # Traefik endpoint (4 replicas across 7 nodes), adding a rescheduling and
      # rollout failure mode in exchange for no benefit.
    ports:
      web:
        port: 80
        # Nothing is routed over plain HTTP — both gateways declare only HTTPS
        # listeners — so without this, port 80 accepts a connection and then
        # answers nothing. Redirecting at the entrypoint catches every hostname
        # on both gateways at once, before any route matching. Safe for cert
        # issuance: the certificates are wildcards and therefore DNS-01, so no
        # HTTP-01 challenge ever travels this path.
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        port: 443
        http3:
          enabled: true
      traefik:
        port: 9000
        expose:
          default: true
        exposedPort: 9000
