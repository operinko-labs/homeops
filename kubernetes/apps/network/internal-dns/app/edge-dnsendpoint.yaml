---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/externaldns.k8s.io/dnsendpoint_v1alpha1.json
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: edge
spec:
  # edge Traefik LXC (forge/, meanie VMID 120): its dashboard. No route.scope
  # label: internal-dns only.
  endpoints:
    - dnsName: edge.vaderrp.com
      recordType: A
      targets: ["192.168.0.5"]
