---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: internal-dns
  namespace: network
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: internal-dns
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # The RFC2136 provider re-applies its entire desired state each cycle
    # rather than diffing, so the 1m default rewrote every record every
    # minute. Event-driven reconciliation below carries real changes
    # promptly, leaving this sweep as only a safety net.
    #
    # Both of these are chart values rather than extraArgs on purpose: the
    # chart renders --interval and --events from them, and passing either
    # flag twice is a fatal "cannot be repeated".
    interval: 10m
    triggerLoopOnEvent: true
    provider: rfc2136
    extraArgs:
      - --rfc2136-host=192.168.5.8
      - --rfc2136-port=53
      - --rfc2136-zone=vaderrp.com
      - --rfc2136-batch-change-size=50
      # external-dns sends TTL 0 when unset, which Technitium stores
      # faithfully — so every lookup of these names bypasses every
      # cache. This floor makes them cacheable (gateway VIPs, effectively static).
      - --rfc2136-min-ttl=300s
      - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
      - --crd-source-kind=DNSEndpoint
      - --annotation-filter=external-dns.alpha.kubernetes.io/ignore notin (true)
    env:
      - name: EXTERNAL_DNS_RFC2136_TSIG_KEYNAME
        valueFrom:
          secretKeyRef:
            name: internal-dns-secret
            key: tsig-name
      - name: EXTERNAL_DNS_RFC2136_TSIG_SECRET
        valueFrom:
          secretKeyRef:
            name: internal-dns-secret
            key: tsig-secret
      - name: EXTERNAL_DNS_RFC2136_TSIG_SECRET_ALG
        valueFrom:
          secretKeyRef:
            name: internal-dns-secret
            key: tsig-algorithm
    policy: sync
    sources: ["crd", "gateway-httproute"]
    txtPrefix: k8s-int.
    txtOwnerId: internal
    domainFilters: ["vaderrp.com"]
    serviceMonitor:
      enabled: true
    podAnnotations:
      secret.reloader.stakater.com/reload: internal-dns-secret
