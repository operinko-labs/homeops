---
# Bulwark is served only on webmail.erinko.fi (httproute-erinko.yaml): its
# Stalwart OAuth client is registered for that host alone, so the old
# address just redirects there
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bulwark-webmail
  namespace: mail
  labels:
    route.scope: external
  annotations:
    external-dns.alpha.kubernetes.io/target: external.vaderrp.com
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Mail
    gethomepage.dev/name: Webmail
    gethomepage.dev/icon: si-maildotcom
    gethomepage.dev/href: https://webmail.erinko.fi
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-public
      namespace: network
  hostnames:
    - webmail.vaderrp.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: webmail.erinko.fi
            statusCode: 301
