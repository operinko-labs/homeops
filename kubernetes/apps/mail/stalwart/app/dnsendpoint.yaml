---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/externaldns.k8s.io/dnsendpoint_v1alpha1.json
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: stalwart-mail
  labels:
    route.scope: external
spec:
  endpoints:
    # Mail server CNAMEs — canonical hostname is mail.erinko.fi (managed manually)
    - dnsName: "mail.vaderrp.com"
      recordType: CNAME
      targets: ["mail.erinko.fi"]
      providerSpecific:
        - name: external-dns.alpha.kubernetes.io/cloudflare-proxied
          value: "false"
    - dnsName: "mail.shadowmorph.info"
      recordType: CNAME
      targets: ["mail.erinko.fi"]
      providerSpecific:
        - name: external-dns.alpha.kubernetes.io/cloudflare-proxied
          value: "false"
    # DMARC external report authorization (RFC 7489 7.1): these domains send
    # aggregate reports to postmaster@erinko.fi, and receivers only deliver
    # them when erinko.fi publishes <domain>._report._dmarc.erinko.fi.
    - dnsName: "vaderrp.com._report._dmarc.erinko.fi"
      recordType: TXT
      targets: ["v=DMARC1"]
    - dnsName: "shadowmorph.info._report._dmarc.erinko.fi"
      recordType: TXT
      targets: ["v=DMARC1"]
    - dnsName: "medikabalans.fi._report._dmarc.erinko.fi"
      recordType: TXT
      targets: ["v=DMARC1"]
    - dnsName: "kyronautopalvelu.fi._report._dmarc.erinko.fi"
      recordType: TXT
      targets: ["v=DMARC1"]
