---
# Data store definition for Stalwart 1.0: the empty stalwart_v1 database that
# stalwart-migrate fills from the 0.16 store. Kept apart from stalwart-secret
# so that adding it does not make Reloader restart the running 0.16 pod.
# 1.0 renamed the PostgreSql `timeout` to `connectTimeout`; the default is used.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stalwart-v1-secret
  namespace: mail
spec:
  refreshInterval: 1h
  target:
    name: stalwart-v1-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        config.json: |
          {
            "@type": "PostgreSql",
            "host": "postgres18-rw.database.svc.cluster.local",
            "port": 5432,
            "database": "stalwart_v1",
            "authUsername": "stalwart",
            "authSecret": {
              "@type": "Value",
              "secret": "{{ .db_password }}"
            },
            "poolMaxConnections": 10
          }
  data:
    - secretKey: db_password
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: afda7dff-e1ac-4c30-9ec9-1f81ad1e9971
        property: db_password
