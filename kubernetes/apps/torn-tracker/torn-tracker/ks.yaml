---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app torn-tracker
  namespace: flux-system
spec:
  targetNamespace: torn-tracker
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: "./kubernetes/apps/torn-tracker/torn-tracker/app"
  prune: true
  dependsOn:
    # Waits for database/torn-tracker-pg to be Ready
    - name: cloudnative-pg
      namespace: database
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
