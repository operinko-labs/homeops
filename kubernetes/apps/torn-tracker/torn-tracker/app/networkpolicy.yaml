---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/networking.k8s.io/networkpolicy_v1.json
# Gotenberg prints whatever page it is asked to, so only the api may ask it
# (the api prints only its own /r/print/ pages), and it may reach only the api
# and DNS: a print can never load anything else in the cluster or outside it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: torn-tracker-gotenberg
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: torn-tracker
      app.kubernetes.io/controller: gotenberg
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: torn-tracker
              app.kubernetes.io/controller: api
      ports:
        - port: 3000
          protocol: TCP
  egress:
    # The api's report pages and their assets
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: torn-tracker
              app.kubernetes.io/controller: api
      ports:
        - port: 3000
          protocol: TCP
    # Resolving the api's Service name
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
