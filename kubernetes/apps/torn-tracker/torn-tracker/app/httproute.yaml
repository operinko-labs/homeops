---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: torn-tracker
  namespace: torn-tracker
  labels:
    route.scope: external
  annotations:
    external-dns.alpha.kubernetes.io/target: external.vaderrp.com
    gatus.home-operations.com/enabled: "true"
    gatus.home-operations.com/endpoint: |
      group: Default
      url: "https://torn-tracker.shadowmorph.info/healthz"
      conditions:
        - "[STATUS] == 200"
        - "[BODY].status == ok"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-public
      namespace: network
  hostnames:
    - torn-tracker.shadowmorph.info
  rules:
    # No auth middleware: members sign in with their own Torn API key
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        # Real visitor IP for the app's per-IP login rate limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: traefik-warp
      backendRefs:
        - name: torn-tracker
          port: 3000
---
# Sold war reports: buyers outside the faction open their report by link here.
# The api answers only /r/ on this host (everything else is 404) and /r/ on no
# other host, so it needs the client's Host header as sent (Traefik's default)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: torn-tracker-war-reports
  namespace: torn-tracker
  labels:
    route.scope: external
  annotations:
    external-dns.alpha.kubernetes.io/target: external.vaderrp.com
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-public
      namespace: network
  hostnames:
    - war-reports.shadowmorph.info
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /r/
      filters:
        # Real visitor IP for the api's per-IP rate limit on link lookups
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: traefik-warp
      backendRefs:
        - name: torn-tracker
          port: 3000
---
# The beta's address, kept so old links and installed PWAs land on the hub
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: torn-tracker-beta-redirect
  namespace: torn-tracker
  labels:
    route.scope: external
  annotations:
    external-dns.alpha.kubernetes.io/target: external.vaderrp.com
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-public
      namespace: network
  hostnames:
    - torn-tracker-beta.shadowmorph.info
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: torn-tracker.shadowmorph.info
            statusCode: 301
