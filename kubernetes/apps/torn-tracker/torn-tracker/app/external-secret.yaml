---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: torn-tracker-secret
  namespace: torn-tracker
spec:
  refreshInterval: 1h
  target:
    name: torn-tracker-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      # Keep the fetched keys below and add DATABASE_URL
      mergePolicy: Merge
      data:
        # Same password as database/torn-tracker-pg-user (the role's)
        DATABASE_URL: "postgres://torn_tracker:{{ .psql_password | urlquery }}@torn-tracker-pg-rw.database.svc.cluster.local:5432/torn_tracker"
  # Shares torn-stats-tracker's item; field names are the env var names the
  # image reads
  data:
    - secretKey: TORN_API_KEY
      sourceRef: &store
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: &item 95dfbd26-4d1d-43c1-b1a5-aa811b6628ca
        property: TORN_API_KEY
    - secretKey: TORNSTATS_API_KEY
      sourceRef: *store
      remoteRef:
        key: *item
        property: TORNSTATS_API_KEY
    - secretKey: FACTION_ID
      sourceRef: *store
      remoteRef:
        key: *item
        property: FACTION_ID
    - secretKey: ADMIN_PASSWORD
      sourceRef: *store
      remoteRef:
        key: *item
        property: ADMIN_PASSWORD
    - secretKey: SESSION_SECRET
      sourceRef: *store
      remoteRef:
        key: *item
        property: SESSION_SECRET
    - secretKey: psql_password
      sourceRef: *store
      remoteRef:
        key: *item
        property: psql_password
    # Web Push (notifications + PWA)
    - secretKey: VAPID_PUBLIC_KEY
      sourceRef: *store
      remoteRef:
        key: *item
        property: VAPID_PUBLIC_KEY
    - secretKey: VAPID_PRIVATE_KEY
      sourceRef: *store
      remoteRef:
        key: *item
        property: VAPID_PRIVATE_KEY
    - secretKey: VAPID_SUBJECT
      sourceRef: *store
      remoteRef:
        key: *item
        property: VAPID_SUBJECT
