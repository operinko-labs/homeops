apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: torn-tracker
  namespace: torn-tracker
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: torn-tracker
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      api:
        # The sign-in and admin-unlock rate limiters are in memory
        replicas: 1
        # The old pod serves until the new one has migrated and is Ready, so
        # a rollout never leaves Traefik with no endpoint ("no available
        # server"). The two overlap for seconds, which only splits the
        # in-memory rate limiters briefly.
        strategy: RollingUpdate
        rollingUpdate:
          surge: 1
          unavailable: 0
        annotations: &annotations
          # Secret changes only apply on restart
          reloader.stakater.com/auto: "true"
        # Every role migrates first: migrations and the one-off import each
        # run under a PostgreSQL advisory lock, so overlapping runs are safe
        initContainers:
          migrate: &migrate
            image: &image
              repository: harbor.vaderrp.com/operinko-labs/torn-tracker
              # Updated by Flux image automation (ImagePolicy flux-system/torn-tracker)
              tag: build-1795637404-sha-b866cae # {"$imagepolicy": "flux-system:torn-tracker:tag"}
            args: ["migrate"]
            # Flow style on purpose: Flux image automation re-indents block
            # lists in this file (yamllint rejects that) but keeps flow ones
            envFrom: &envFrom [{secretRef: {name: torn-tracker-secret}}]
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 96Mi
              limits:
                memory: 256Mi
          # The api only, after migrating: registers the Discord slash
          # commands when this release's differ from the last sync. Skips
          # when they are in sync, never syncs an older release over a newer
          # one, and always exits 0, so it never holds the pod in Init
          sync-commands:
            dependsOn: migrate
            image: *image
            args: ["sync-commands"]
            envFrom: *envFrom
            securityContext: *securityContext
            resources:
              requests:
                cpu: 10m
                memory: 96Mi
              limits:
                memory: 256Mi
        containers:
          app:
            image: *image
            args: ["api"]
            env:
              # cloudflared -> Traefik (traefik-warp sets the visitor IP from
              # CF-Connecting-IP): the visitor is two hops in
              TRUST_PROXY_HOPS: "2"
              # Sold war reports: the buyers' pages are served on this host
              # only (httproute.yaml), and printed to PDF by the gotenberg
              # controller below. REPORTS_PRINT_BASE keeps its default, this
              # release's own Service (torn-tracker.torn-tracker.svc:3000)
              REPORTS_HOST: war-reports.shadowmorph.info
              GOTENBERG_URL: http://torn-tracker-gotenberg:3000
            envFrom: *envFrom
            # Keep serving while Traefik drops this endpoint, then SIGTERM
            # closes the server gracefully
            lifecycle:
              preStop:
                sleep:
                  seconds: 5
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  # Stays 200 while Torn or the database is down
                  httpGet: &healthz
                    path: /healthz
                    port: &port 3000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  # Quick, so a rollout hands over within seconds
                  httpGet: *healthz
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 3
            securityContext: *securityContext
            resources:
              requests:
                cpu: 10m
                memory: 96Mi
              limits:
                memory: 256Mi
      collector:
        # Owns the snapshot schedules: never more than 1
        replicas: 1
        strategy: Recreate
        annotations: *annotations
        initContainers: &initContainers {migrate: *migrate}
        containers:
          app:
            image: *image
            args: ["collector"]
            envFrom: *envFrom
            # No HTTP port; watch /healthz on the api instead
            probes: &noProbes
              liveness: {enabled: false}
              readiness: {enabled: false}
              startup: {enabled: false}
            securityContext: *securityContext
            resources:
              requests:
                cpu: 10m
                memory: 96Mi
              limits:
                memory: 256Mi
      gateway:
        # Holds the Discord Gateway connection: never more than 1, and
        # Recreate so two never connect at once during a rollout
        replicas: 1
        strategy: Recreate
        annotations: *annotations
        initContainers: *initContainers
        containers:
          app:
            image: *image
            args: ["gateway"]
            envFrom: *envFrom
            # Serves nothing; a failed start shows as CrashLoopBackOff
            probes: *noProbes
            securityContext: *securityContext
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              # discord.js keeps a guild cache (one ~100-member server)
              limits:
                memory: 384Mi
      modeler:
        replicas: 1
        strategy: Recreate
        annotations: *annotations
        initContainers: *initContainers
        containers:
          app:
            image: *image
            args: ["modeler"]
            env:
              # Node caps its heap at about half the container's memory by default (~512 MB of 1Gi), which a fresh start outgrew
              # on 2026-10-23 (heap OOM at start-up); let it use the limit, leaving ~380 MB for everything outside the heap
              NODE_OPTIONS: "--max-old-space-size=1152"
            envFrom: *envFrom
            probes: *noProbes
            securityContext: *securityContext
            resources:
              requests:
                cpu: 10m
                # Covers a 30-day pass (benchmark peak heap 401 MB) so the scheduler reserves it and memory pressure doesn't
                # evict the modeler first
                memory: 384Mi
              # Loads the whole observation history every pass: raise as it grows (with NODE_OPTIONS above)
              limits:
                memory: 1536Mi
      gotenberg:
        # Prints a sold war report's page to PDF for the api, once per report.
        # Reachable from the api only, and its Chromium may load only the
        # api's /r/ pages (networkpolicy.yaml, --chromium-allow-list)
        replicas: 1
        strategy: RollingUpdate
        pod:
          # The image's own user, which owns /home/gotenberg. In full, as a
          # pod's own securityContext replaces the default one
          securityContext:
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
        containers:
          app:
            image:
              # The api's print request (Chromium URL route, paper, margins,
              # waitForExpression, extraHttpHeaders) is the same in v8 and v9
              repository: harbor.vaderrp.com/dockerhub/gotenberg/gotenberg
              tag: 9.9.3
            args:
              - gotenberg
              # Above the api's 60 s abort, so the api gives up first
              - --api-timeout=90s
              - --chromium-allow-list=^http://torn-tracker\.torn-tracker\.svc:3000/r/
              - --chromium-deny-public-ips
              - --libreoffice-disable-routes
              # Print only: no PDF routes, and no post-processing stages on
              # the Chromium route. v9 has no metrics unless OTEL asks for them
              - --pdf-disable-routes
              - --pdf-disable-stages
              - --webhook-disable
            probes:
              liveness: &gotenbergProbe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &gotenbergPort 3000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *gotenbergProbe
            securityContext:
              allowPrivilegeEscalation: false
              # Chromium writes its profile and caches under /tmp and $HOME
              readOnlyRootFilesystem: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
    service:
      app:
        # With two services app-template suffixes both names; keep this one's
        # (the HTTPRoutes, site-overview and REPORTS_PRINT_BASE all use it)
        forceRename: torn-tracker
        controller: api
        ports:
          http:
            port: *port
          status:
            port: 9095
      gotenberg:
        controller: gotenberg
        ports:
          http:
            port: *gotenbergPort
