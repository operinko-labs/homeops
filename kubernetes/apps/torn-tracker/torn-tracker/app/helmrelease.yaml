apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: torn-tracker
  namespace: torn-tracker
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: torn-tracker
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      api:
        # The sign-in and admin-unlock rate limiters are in memory
        replicas: 1
        # The old pod serves until the new one has migrated and is Ready, so
        # a rollout never leaves Traefik with no endpoint ("no available
        # server"). The two overlap for seconds, which only splits the
        # in-memory rate limiters briefly.
        strategy: RollingUpdate
        rollingUpdate:
          surge: 1
          unavailable: 0
        annotations: &annotations
          # Secret changes only apply on restart
          reloader.stakater.com/auto: "true"
        # Every role migrates first: migrations and the one-off import each
        # run under a PostgreSQL advisory lock, so overlapping runs are safe
        initContainers: &initContainers
          migrate:
            image: &image
              repository: harbor.vaderrp.com/operinko-labs/torn-tracker
              # Updated by Flux image automation (ImagePolicy flux-system/torn-tracker)
              tag: build-1791588112-sha-e1f0c5b # {"$imagepolicy": "flux-system:torn-tracker:tag"}
            args: ["migrate"]
            envFrom: &envFrom
            - secretRef:
                name: torn-tracker-secret
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 96Mi
              limits:
                memory: 256Mi
        containers:
          app:
            image: *image
            args: ["api"]
            env:
              # cloudflared -> Traefik (traefik-warp sets the visitor IP from
              # CF-Connecting-IP): the visitor is two hops in
              TRUST_PROXY_HOPS: "2"
            envFrom: *envFrom
            # Keep serving while Traefik drops this endpoint, then SIGTERM
            # closes the server gracefully
            lifecycle:
              preStop:
                sleep:
                  seconds: 5
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  # Stays 200 while Torn or the database is down
                  httpGet: &healthz
                    path: /healthz
                    port: &port 3000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  # Quick, so a rollout hands over within seconds
                  httpGet: *healthz
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 3
            securityContext: *securityContext
            resources:
              requests:
                cpu: 10m
                memory: 96Mi
              limits:
                memory: 256Mi
      collector:
        # Owns the snapshot schedules: never more than 1
        replicas: 1
        strategy: Recreate
        annotations: *annotations
        initContainers: *initContainers
        containers:
          app:
            image: *image
            args: ["collector"]
            envFrom: *envFrom
            # No HTTP port; watch /healthz on the api instead
            probes: &noProbes
              liveness: {enabled: false}
              readiness: {enabled: false}
              startup: {enabled: false}
            securityContext: *securityContext
            resources:
              requests:
                cpu: 10m
                memory: 96Mi
              limits:
                memory: 256Mi
      modeler:
        replicas: 1
        strategy: Recreate
        annotations: *annotations
        initContainers: *initContainers
        containers:
          app:
            image: *image
            args: ["modeler"]
            envFrom: *envFrom
            probes: *noProbes
            securityContext: *securityContext
            resources:
              requests:
                cpu: 10m
                memory: 96Mi
              # Loads the whole observation history every pass: raise as it grows
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
    service:
      app:
        controller: api
        ports:
          http:
            port: *port
