apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: autoposter
  namespace: media
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: autoposter
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controllers:
      autoposter:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: harbor.vaderrp.com/operinko-labs/autoposter
              # Updated by Flux image automation (ImagePolicy flux-system/autoposter)
              tag: build-1787750120-sha-9cd2a0f # {"$imagepolicy": "flux-system:autoposter:tag"}
            env:
              TZ: Europe/Helsinki
              # python-plexapi and friends want a writable HOME
              HOME: /tmp
              AUTOPOSTER_CONFIG: /config/autoposter.yaml
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
              - secretRef:
                  name: "{{ .Release.Name }}-sops"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 4096Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      dnsConfig:
        options:
          - name: ndots
            value: "1"
          - name: use-vc
          - name: single-request-reopen
    service:
      app:
        ports:
          http:
            port: *port
    persistence:
      config:
        type: configMap
        name: "{{ .Release.Name }}-config"
        globalMounts:
          - path: /config
            readOnly: true
      # Production overlays + font (copied from the Posterizarr pod), placed
      # where config.yaml's overlays_root/fonts_root point inside the image
      overlays:
        type: configMap
        name: "{{ .Release.Name }}-overlays"
        globalMounts:
          - path: /app/assets/overlays/overlay.png
            subPath: overlay.png
          - path: /app/assets/overlays/bottom-up-fade.png
            subPath: bottom-up-fade.png
          - path: /app/assets/overlays/bottom-up-fade-background.png
            subPath: bottom-up-fade-background.png
          - path: /app/assets/fonts/Comfortaa-Medium.ttf
            subPath: Comfortaa-Medium.ttf
      # Same NFS share Posterizarr writes and Kometa reads (asset tree)
      assets:
        type: nfs
        server: 192.168.0.221
        path: /mnt/Nakkiallas/Public/posterizarr
        globalMounts:
          - path: /assets
      manualassets:
        type: emptyDir
        globalMounts:
          - path: /manualassets
      assetsbackup:
        type: emptyDir
        globalMounts:
          - path: /assetsbackup
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
