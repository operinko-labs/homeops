apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: autoposter
  namespace: media
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: autoposter
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controllers:
      autoposter:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # Seed the writable brand volume from the autoposter-overlays ConfigMap,
          # ONCE, and never over a file that is already there. The ConfigMap bytes
          # are what every stored render fingerprint in this deployment was computed
          # against (the font's bytes are hashed into each one), so seeding from any
          # other copy — the image's own assets/fonts/Comfortaa-Medium.ttf included,
          # which is a DIFFERENT file — would re-render the whole library.
          seed-brand:
            image:
              repository: ghcr.io/home-operations/busybox
              tag: 1.38.0
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                mkdir -p /app/assets/overlays /app/assets/fonts
                for f in /seed/*.png; do
                  [ -e "/app/assets/overlays/$(basename "$f")" ] || cp "$f" /app/assets/overlays/
                done
                for f in /seed/*.ttf; do
                  [ -e "/app/assets/fonts/$(basename "$f")" ] || cp "$f" /app/assets/fonts/
                done
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
        containers:
          app:
            image:
              repository: harbor.vaderrp.com/operinko-labs/autoposter
              # Updated by Flux image automation (ImagePolicy flux-system/autoposter)
              tag: build-1788937541-sha-9d13723 # {"$imagepolicy": "flux-system:autoposter:tag"}
            env:
              TZ: Europe/Helsinki
              # python-plexapi and friends want a writable HOME
              HOME: /tmp
              AUTOPOSTER_CONFIG: /config/autoposter.yaml
              # ImageMagick sizes its pixel cache from the NODE's RAM (measured
              # 19.5GiB/39GiB in-pod), not the 6096Mi cgroup — five concurrent
              # renders OOMKilled the pod (2026-09-02). Cap each magick process
              # so it spills to the disk-backed /tmp instead; 5 workers ×
              # 768MiB + app baseline stays under the limit.
              MAGICK_MEMORY_LIMIT: 768MiB
              MAGICK_MAP_LIMIT: 1536MiB
              MAGICK_DISK_LIMIT: 8GiB
              # 11 OpenMP threads per invocation × 5 workers thrashed the CPU
              # (the 5237m reconcile storm); renders are throughput work.
              MAGICK_THREAD_LIMIT: "2"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
              - secretRef:
                  name: "{{ .Release.Name }}-sops"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 6096Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      dnsConfig:
        options:
          - name: ndots
            value: "1"
          - name: use-vc
          - name: single-request-reopen
    service:
      app:
        ports:
          http:
            port: *port
    persistence:
      config:
        type: configMap
        name: "{{ .Release.Name }}-config"
        globalMounts:
          - path: /config
            readOnly: true
      # The seed source only. Mounted as a whole directory into the init container
      # and into nothing else, so the app never reads a ConfigMap file directly.
      overlays-seed:
        type: configMap
        name: "{{ .Release.Name }}-overlays"
        advancedMounts:
          autoposter:
            seed-brand:
              - path: /seed
                readOnly: true
      # Writable, persistent, and mounted AT THE PATHS config.yaml ALREADY NAMES.
      # fonts_root and overlays_root are hashed as STRINGS into every art kind's
      # render_version (config/loader.py), so repointing them would move every
      # stored fingerprint in the library. They do not move.
      state:
        type: persistentVolumeClaim
        # Single PVC in the release would otherwise be named just "autoposter"
        suffix: state
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: local-path
        retain: true
        globalMounts:
          - path: /app/assets/overlays
            subPath: overlays
          - path: /app/assets/fonts
            subPath: fonts
            # Row 121 (first-start setup) adds exactly this one entry to this same
            # volume when it lands. AUTOPOSTER_STATE_DIR already defaults to /state
            # (config/state.py), and this deployment's environment is complete,
            # so the mount is inert until a deployment actually needs setup mode.
            # - path: /state
            #   subPath: setup
      # Same NFS share Posterizarr writes and Kometa reads (asset tree);
      # static PV/PVC in nfs.yaml carries the sync-related mountOptions
      assets:
        existingClaim: autoposter-assets-nfs
        globalMounts:
          - path: /assets
      manualassets:
        existingClaim: autoposter-manualassets-nfs
        globalMounts:
          - path: /manualassets
      assetsbackup:
        existingClaim: autoposter-assetsbackup-nfs
        globalMounts:
          - path: /assetsbackup
      plexbackup:
        existingClaim: autoposter-plexbackup-nfs
        globalMounts:
          - path: /plexbackup
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
