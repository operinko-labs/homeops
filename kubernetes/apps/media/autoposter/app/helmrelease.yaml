apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: autoposter
  namespace: media
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: autoposter
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controllers:
      autoposter:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: harbor.vaderrp.com/operinko-labs/autoposter
              # Updated by Flux image automation (ImagePolicy flux-system/autoposter)
              tag: build-1788742660-sha-74fac8d # {"$imagepolicy": "flux-system:autoposter:tag"}
            env:
              TZ: Europe/Helsinki
              # python-plexapi and friends want a writable HOME
              HOME: /tmp
              AUTOPOSTER_CONFIG: /config/autoposter.yaml
              # ImageMagick sizes its pixel cache from the NODE's RAM (measured
              # 19.5GiB/39GiB in-pod), not the 6096Mi cgroup — five concurrent
              # renders OOMKilled the pod (2026-09-02). Cap each magick process
              # so it spills to the disk-backed /tmp instead; 5 workers ×
              # 768MiB + app baseline stays under the limit.
              MAGICK_MEMORY_LIMIT: 768MiB
              MAGICK_MAP_LIMIT: 1536MiB
              MAGICK_DISK_LIMIT: 8GiB
              # 11 OpenMP threads per invocation × 5 workers thrashed the CPU
              # (the 5237m reconcile storm); renders are throughput work.
              MAGICK_THREAD_LIMIT: "2"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
              - secretRef:
                  name: "{{ .Release.Name }}-sops"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 6096Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      dnsConfig:
        options:
          - name: ndots
            value: "1"
          - name: use-vc
          - name: single-request-reopen
    service:
      app:
        ports:
          http:
            port: *port
    persistence:
      config:
        type: configMap
        name: "{{ .Release.Name }}-config"
        globalMounts:
          - path: /config
            readOnly: true
      # Production overlays + font (copied from the Posterizarr pod), placed
      # where config.yaml's overlays_root/fonts_root point inside the image
      overlays:
        type: configMap
        name: "{{ .Release.Name }}-overlays"
        globalMounts:
          - path: /app/assets/overlays/overlay.png
            subPath: overlay.png
          - path: /app/assets/overlays/bottom-up-fade.png
            subPath: bottom-up-fade.png
          - path: /app/assets/overlays/bottom-up-fade-background.png
            subPath: bottom-up-fade-background.png
          - path: /app/assets/fonts/Comfortaa-Medium.ttf
            subPath: Comfortaa-Medium.ttf
      # Same NFS share Posterizarr writes and Kometa reads (asset tree);
      # static PV/PVC in nfs.yaml carries the sync-related mountOptions
      assets:
        existingClaim: autoposter-assets-nfs
        globalMounts:
          - path: /assets
      manualassets:
        existingClaim: autoposter-manualassets-nfs
        globalMounts:
          - path: /manualassets
      assetsbackup:
        existingClaim: autoposter-assetsbackup-nfs
        globalMounts:
          - path: /assetsbackup
      plexbackup:
        existingClaim: autoposter-plexbackup-nfs
        globalMounts:
          - path: /plexbackup
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
