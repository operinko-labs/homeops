---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: autoposter-secret
  namespace: media
spec:
  refreshInterval: 1h
  target:
    name: autoposter-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        AUTOPOSTER_PLEX_TOKEN: "{{ .plextoken }}"
        # TMDB Read Access Token (the long v4 bearer), same field posterizarr used
        AUTOPOSTER_TMDB_TOKEN: "{{ .tmdbtoken }}"
        AUTOPOSTER_TVDB_APIKEY: "{{ .tvdbapi }}"
        AUTOPOSTER_FANART_APIKEY: "{{ .fanarttvapikey }}"
        AUTOPOSTER_MDBLIST_APIKEY: "{{ .mdblistapikey }}"
        AUTOPOSTER_RADARR_APIKEY: "{{ .radarrapikey }}"
        AUTOPOSTER_SONARR_APIKEY: "{{ .sonarrapikey }}"
        AUTOPOSTER_TRACEARR_APIKEY: "{{ .tracearrapikey }}"
  data:
    # Shared media-credentials item (same one kometa/posterizarr use)
    - secretKey: plextoken
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 82de75a5-08e1-4f8c-82a3-1b45d067e78e
        property: plextoken
    - secretKey: tmdbtoken
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 82de75a5-08e1-4f8c-82a3-1b45d067e78e
        property: tmdbtoken
    - secretKey: tvdbapi
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 82de75a5-08e1-4f8c-82a3-1b45d067e78e
        property: tvdbapi
    - secretKey: fanarttvapikey
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 82de75a5-08e1-4f8c-82a3-1b45d067e78e
        property: fanarttvapikey
    - secretKey: mdblistapikey
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 82de75a5-08e1-4f8c-82a3-1b45d067e78e
        property: mdblistapikey
    - secretKey: tracearrapikey
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 82de75a5-08e1-4f8c-82a3-1b45d067e78e
        property: tracearrapikey
    # Radarr API key (same item as radarr's own external-secret)
    - secretKey: radarrapikey
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 94a56c69-171b-480c-8152-ec5fd0797a8a
        property: apikey
    # Sonarr API key (same item as sonarr's own external-secret)
    - secretKey: sonarrapikey
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 3877177e-270a-4def-901b-9d0c12b23248
        property: apikey
