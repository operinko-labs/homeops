---
# Helm values for kometa app-template deployment
controllers:
  kometa:
    type: cronjob
    cronjob:
      # Daily metadata run at 06:00 local time
      schedule: "0 6 * * *"
      timeZone: Europe/Helsinki
      concurrencyPolicy: Forbid
      successfulJobsHistory: 1
      failedJobsHistory: 1
    serviceAccount:
      identifier: kometa
    initContainers:
      # Serialize kometa runs across ALL jobs (scheduled + webhook-triggered):
      # wait until no other kometa job is active, then proceed. Queue-style,
      # so triggered runs are delayed instead of dropped, and state lives in
      # the API server (nothing to go stale, unlike a lockfile).
      wait-for-turn:
        image:
          repository: docker.io/alpine/k8s
          tag: 1.36.2
        env:
          JOB_NAME:
            valueFrom:
              fieldRef:
                fieldPath: metadata.labels['job-name']
        command:
          - sh
          - -c
          - |
            while true; do
              active=$(kubectl get jobs -n media -o json | jq -r --arg self "$JOB_NAME" \
                '[.items[] | select(.metadata.name != $self)
                           | select(.metadata.name | startswith("kometa"))
                           | select((.status.active // 0) > 0)] | length')
              if [ "$active" = "0" ]; then
                echo "no other kometa jobs active - proceeding"
                exit 0
              fi
              echo "$active other kometa job(s) active - waiting 30s"
              sleep 30
            done
    containers:
      app:
        image:
          repository: docker.io/kometateam/kometa
          tag: v2.4.5@sha256:a376a1818196cde159b5a4d5a6ad55411415f7b5bc38d8a27e8c718bae7f0ddd
        # Run once and exit (scheduling is handled by the CronJob)
        args:
          - --run
        env:
          TZ: Europe/Helsinki
          # Config is mounted from a ConfigMap — don't let Kometa write it back
          KOMETA_READ_ONLY_CONFIG: "true"
        envFrom:
          - secretRef:
              name: kometa-secret
        probes:
          liveness:
            enabled: false
          readiness:
            enabled: false
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
        resources:
          requests:
            cpu: 10m
            memory: 512Mi
          limits:
            # First full-library run (episode overlays + caching) is memory
            # hungry - repeatedly OOMKilled at 2Gi
            memory: 6Gi
defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 568
    runAsGroup: 568
    fsGroup: 568
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: {type: RuntimeDefault}
  dnsConfig:
    options:
      - name: ndots
        value: "1"
      - name: use-vc
      - name: single-request-reopen
persistence:
  config:
    type: persistentVolumeClaim
    existingClaim: kometa
    globalMounts:
      - path: /config
  # Posterizarr's generated assets (shared NFS) — used as overlay base via
  # per-library asset_directory + prioritize_assets in config.yaml
  assets:
    type: nfs
    server: 192.168.0.221
    path: /mnt/Nakkiallas/Public/posterizarr
    globalMounts:
      - path: /assets
        readOnly: true
  config-file:
    type: configMap
    name: kometa-config
    globalMounts:
      - path: /config/config.yml
        subPath: config.yml
        readOnly: true
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
serviceAccount:
  kometa: {}
