---
apiVersion: v1
kind: ConfigMap
metadata:
  name: configarr-config
data:
  config.yml: |
    # Configarr Configuration
    # TRaSH-Guides and Recyclarr template repositories
    trashGuideUrl: https://github.com/TRaSH-Guides/Guides
    recyclarrConfigUrl: https://github.com/recyclarr/config-templates

    # Local paths for custom formats and templates
    localCustomFormatsPath: /app/data/cfs
    localConfigTemplatesPath: /app/data/templates

    # Sonarr Configuration
    sonarr:
      web-1080p-v4:
        base_url: http://sonarr.media.svc.cluster.local.
        api_key: !secret SONARR_API_KEY

        quality_definition:
          type: series
        include:
          - template: 72dae194fc92bf828f32cde7744e51a1 # WEB-1080p
            source: TRASH

        custom_formats:
          - trash_ids:
              - 47435ece6b99a0b477caf360e79ba0bb # x265 (HD)
            assign_scores_to:
              - name: WEB-1080p
                score: 100

          # Dolby Vision profile 5 has no HDR10 base layer; Plex can't play or
          # tone-map it. Ultra-HD exists only on the server (not managed here).
          - trash_ids:
              - 9b27ab6498ec0f31a3353992e19434ca # DV (w/o HDR fallback)
            assign_scores_to:
              - name: WEB-1080p
                score: -20000
              - name: Ultra-HD
                score: -20000

    # Radarr Configuration
    radarr:
      instance1:
        # No trailing dot: Radarr 6 answers 400 to a "radarr.media.svc.cluster.local." Host header.
        base_url: http://radarr.media.svc.cluster.local
        api_key: !secret RADARR_API_KEY
        quality_definition:
          type: movie
        include:
          - template: d1d67249d3890e49bc12e275d989a7e9 # HD Bluray + WEB
            source: TRASH

        custom_formats:
          - trash_ids:
              - b6832f586342ef70d9c128d40c07b872 # Bad Dual Groups
            assign_scores_to:
              - name: HD Bluray + WEB

          - trash_ids:
              - dc98083864ea246d05a42df0d05f81cc # x265 (HD)
            assign_scores_to:
              - name: HD Bluray + WEB
                score: 100

          # Dolby Vision profile 5 has no HDR10 base layer; Plex can't play or
          # tone-map it. Any, Ultra-HD and the Nordic profile exist only on the
          # server (not managed here); Any holds most movies and allows 2160p.
          - trash_ids:
              - 923b6abef9b17f937fab56cfcf89e1f1 # DV (w/o HDR fallback)
            assign_scores_to:
              - name: HD Bluray + WEB
                score: -20000
              - name: HD Bluray + WEB - Nordic
                score: -20000
              - name: Any
                score: -20000
              - name: Ultra-HD
                score: -20000
