---
# Static PV/PVC so the NFS mounts get mountOptions (inline nfs volumes
# can't carry them — only PersistentVolume.spec.mountOptions is honored)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: bazarr-media-nfs
spec:
  capacity:
    storage: 1Gi
  accessModes: ["ReadWriteMany"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
    - lookupcache=none
    - actimeo=1
  nfs:
    server: 192.168.7.198
    path: /mnt/Nakkiallas/Media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bazarr-media-nfs
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 1Gi
  storageClassName: ""
  volumeName: bazarr-media-nfs
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: bazarr-backup-nfs
spec:
  capacity:
    storage: 1Gi
  accessModes: ["ReadWriteMany"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
    - lookupcache=none
    - actimeo=1
  nfs:
    server: 192.168.7.198
    path: /mnt/Nakkiallas/Download/BazarrBackup
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bazarr-backup-nfs
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 1Gi
  storageClassName: ""
  volumeName: bazarr-backup-nfs
