---
# Helm values for bazarr app-template deployment
controllers:
  bazarr:
    annotations:
      reloader.stakater.com/auto: "true"
    initContainers:
      init-db:
        image:
          repository: ghcr.io/home-operations/postgres-init
          tag: 18.6
        env:
          INIT_POSTGRES_DBNAME: bazarr
          INIT_POSTGRES_HOST: postgres17.database.svc.cluster.local.
        envFrom:
          - secretRef:
              name: bazarr-secret
    containers:
      app:
        image:
          repository: ghcr.io/home-operations/bazarr
          tag: 1.6.1@sha256:e5d192a6f62a4f2336b40e1021fb3e31acfeb125ba970b65bcf6d607e29146cf
        env:
          TZ: Europe/Helsinki
          # PostgreSQL configuration
          POSTGRES_ENABLED: "true"
          POSTGRES_PORT: "5432"
          POSTGRES_DATABASE: bazarr
        envFrom:
          - secretRef:
              name: bazarr-secret
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: &port 6767
              initialDelaySeconds: 120
              periodSeconds: 10
              timeoutSeconds: 10
              failureThreshold: 6
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: *port
              initialDelaySeconds: 30
              periodSeconds: 10
              timeoutSeconds: 10
              failureThreshold: 3
        securityContext: &securityContext
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
        resources:
          requests:
            cpu: 100m
            memory: 428Mi
          limits:
            memory: 1Gi
      subcleaner:
        image:
          repository: registry.k8s.io/git-sync/git-sync
          tag: v4.7.1@sha256:c5e1976da735bf0b53979f079a07475d77174c51863cd084e928ff6074480717
        env:
          GITSYNC_REPO: https://github.com/KBlixt/subcleaner
          GITSYNC_REF: master
          GITSYNC_PERIOD: 24h
          GITSYNC_ROOT: /subcleaner
        resources:
          requests:
            cpu: 10m
          limits:
            memory: 128Mi
        securityContext: *securityContext
defaultPodOptions:
  dnsConfig:
    options:
      - name: ndots
        value: "1"
      - name: use-vc
      - name: single-request-reopen
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
service:
  app:
    controller: bazarr
    ports:
      http:
        port: *port
persistence:
  config:
    existingClaim: bazarr
  config-cache:
    type: emptyDir
    globalMounts:
      - path: /config/cache
  config-log:
    type: emptyDir
    globalMounts:
      - path: /config/log
  media:
    existingClaim: bazarr-media-nfs
    globalMounts:
      - path: /media
  backup:
    existingClaim: bazarr-backup-nfs
    globalMounts:
      - path: /config/backup
  scripts:
    type: configMap
    name: bazarr-scripts
    defaultMode: 0775
    globalMounts:
      - path: /scripts/subcleaner.sh
        subPath: subcleaner.sh
        readOnly: true
  subcleaner:
    type: emptyDir
  tmp:
    type: emptyDir
