---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: subsarr
  namespace: flux-system
spec:
  targetNamespace: media
  commonMetadata:
    labels:
      app.kubernetes.io/name: subsarr
  path: "./kubernetes/apps/media/subsarr/app"
  prune: true
  dependsOn:
    - name: volsync
      namespace: storage
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  components:
    - ../../../../components/volsync-kopia
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: subsarr
      VOLSYNC_COPYMETHOD: Direct
      VOLSYNC_CAPACITY: 20Gi
      VOLSYNC_STORAGECLASS: local-path
      VOLSYNC_PUID: "1000"
      VOLSYNC_PGID: "1000"
