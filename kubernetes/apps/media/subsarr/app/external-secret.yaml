---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: subsarr-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-fields
    kind: ClusterSecretStore
  target:
    name: subsarr-secret
    creationPolicy: Owner
  data:
    # Versity account `subsarr`, owner of bucket `subsarr`
    - secretKey: SUBSARR_S3_ACCESS_KEY
      remoteRef:
        key: 44d478ef-dfb9-48ea-bcca-7e47ac5c93b0
        property: subsarr_access_key
    - secretKey: SUBSARR_S3_SECRET_KEY
      remoteRef:
        key: 44d478ef-dfb9-48ea-bcca-7e47ac5c93b0
        property: subsarr_secret_key
