---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: subsarr
  namespace: media
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: subsarr
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: subsarr-values
