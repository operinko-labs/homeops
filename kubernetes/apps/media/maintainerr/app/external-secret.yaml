---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: maintainerr-secret
  namespace: media
spec:
  refreshInterval: 1h
  target:
    name: maintainerr-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # Plex Token (reuse from existing secret)
    - secretKey: PLEX_TOKEN
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: ClusterSecretStore
      remoteRef:
        key: 5647493e-c66e-47c2-b26b-3607d8b0e59c
        property: password

    # Sonarr API Key
    - secretKey: SONARR_API_KEY
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 3877177e-270a-4def-901b-9d0c12b23248
        property: apikey

    # Radarr API Key
    - secretKey: RADARR_API_KEY
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 4112e5d7-bf16-4391-ba39-787b32c9fb28
        property: apikey

    # Tautulli API Key
    - secretKey: TAUTULLI_API_KEY
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: eed8dbed-39bb-41d3-a2f3-21a7559d3eff
        property: apikey

    # Overseerr API Key
    - secretKey: OVERSEERR_API_KEY
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 7fc85fc5-a248-467c-9e6e-f991c7ad3685
        property: apikey
