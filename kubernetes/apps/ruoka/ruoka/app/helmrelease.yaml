---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ruoka
  namespace: ruoka
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: ruoka
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      ruoka:
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"

        # The page has to exist before nginx accepts traffic, otherwise the
        # first readiness probe races the first clone.
        initContainers:
          git-sync-init:
            image: &gitSyncImage
              repository: registry.k8s.io/git-sync/git-sync
              tag: v4.7.1
            # Same configuration as the sidecar, but clone once and exit.
            args: ["--one-time"]
            env: &gitSyncEnv
              GITSYNC_REPO: https://forgejo.vaderrp.com/operinko-labs/ruoka
              GITSYNC_REF: dist
              GITSYNC_ROOT: /www
              GITSYNC_LINK: current
              GITSYNC_DEPTH: 1
              GITSYNC_PERIOD: 60s
              GITSYNC_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: ruoka-forgejo-pat
                    key: username
              GITSYNC_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: ruoka-forgejo-pat
                    key: password
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources: &gitSyncResources
              requests:
                cpu: 10m
              limits:
                memory: 128Mi

        containers:
          app:
            image:
              repository: docker.io/nginxinc/nginx-unprivileged
              tag: 1.31-alpine
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probe
            securityContext: *securityContext
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 64Mi

          # Keeps /www/current pointing at the newest `dist` commit. A Sveltia
          # edit is on the tablet within a minute of the Action finishing.
          git-sync:
            image: *gitSyncImage
            env: *gitSyncEnv
            securityContext: *securityContext
            resources: *gitSyncResources

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}

    service:
      app:
        controller: ruoka
        ports:
          http:
            port: 80
            targetPort: 8080

    persistence:
      # Shared between git-sync and nginx. Deliberately ephemeral: the whole
      # site is ~40 kB, so re-cloning on pod start is cheaper than a PVC.
      www:
        type: emptyDir
        advancedMounts:
          ruoka:
            git-sync-init:
              - path: /www
            git-sync:
              - path: /www
            app:
              - path: /www
                readOnly: true

      nginx-config:
        type: configMap
        name: ruoka-nginx
        advancedMounts:
          ruoka:
            app:
              - path: /etc/nginx/conf.d/default.conf
                subPath: nginx.conf
                readOnly: true

      # readOnlyRootFilesystem means nginx needs somewhere for its pid file and
      # client temp paths, and git-sync needs somewhere for its git config.
      tmp:
        type: emptyDir
        advancedMounts:
          ruoka:
            app:
              - path: /tmp
            git-sync-init:
              - path: /tmp
            git-sync:
              - path: /tmp

      nginx-cache:
        type: emptyDir
        advancedMounts:
          ruoka:
            app:
              - path: /var/cache/nginx

    ingress:
      app:
        enabled: false
