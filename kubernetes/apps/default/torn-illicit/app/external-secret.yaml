---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: torn-illicit-secret
  namespace: default
spec:
  refreshInterval: 1h
  target:
    name: torn-illicit-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  # Field names in the item are the env var names the image reads
  data:
    - secretKey: TORNSTATS_API_KEY
      sourceRef: &store
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: &item 60b35c87-316e-40c9-989b-6ee376e9b7f9
        property: TORNSTATS_API_KEY
    - secretKey: FACTION_ID
      sourceRef: *store
      remoteRef:
        key: *item
        property: FACTION_ID
    - secretKey: VIEWER_PASSWORD
      sourceRef: *store
      remoteRef:
        key: *item
        property: VIEWER_PASSWORD
    - secretKey: ADMIN_PASSWORD
      sourceRef: *store
      remoteRef:
        key: *item
        property: ADMIN_PASSWORD
    - secretKey: SESSION_SECRET
      sourceRef: *store
      remoteRef:
        key: *item
        property: SESSION_SECRET
