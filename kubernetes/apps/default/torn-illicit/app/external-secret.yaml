---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: torn-illicit-secret
  namespace: default
spec:
  refreshInterval: 1h
  target:
    name: torn-illicit-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # No TORNSTATS_API_KEY: the faction's admin enters its own key on the
        # Settings page. The previous key belonged to a member who has left,
        # and Torn Stats' /faction/skills answers for the key owner's faction.
        FACTION_ID: "{{ .FACTION_ID }}"
        VIEWER_PASSWORD: "{{ .VIEWER_PASSWORD }}"
        ADMIN_PASSWORD: "{{ .ADMIN_PASSWORD }}"
        SESSION_SECRET: "{{ .SESSION_SECRET }}"
  # Field names in the item are the env var names the image reads
  data:
    - secretKey: FACTION_ID
      sourceRef: &store
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: &item 60b35c87-316e-40c9-989b-6ee376e9b7f9
        property: FACTION_ID
    - secretKey: VIEWER_PASSWORD
      sourceRef: *store
      remoteRef:
        key: *item
        property: VIEWER_PASSWORD
    - secretKey: ADMIN_PASSWORD
      sourceRef: *store
      remoteRef:
        key: *item
        property: ADMIN_PASSWORD
    - secretKey: SESSION_SECRET
      sourceRef: *store
      remoteRef:
        key: *item
        property: SESSION_SECRET
