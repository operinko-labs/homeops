apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: torn-illicit
  namespace: default
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: torn-illicit
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      torn-illicit:
        # SQLite has one writer and the daily snapshot timer runs in-process
        replicas: 1
        strategy: Recreate
        annotations:
          # Password or session secret changes only apply on restart
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: harbor.vaderrp.com/operinko-labs/torn-stats-tracker
              # Updated by Flux image automation (ImagePolicy flux-system/torn-stats-tracker)
              tag: build-1793055434-sha-c073a67 # {"$imagepolicy": "flux-system:torn-stats-tracker:tag"}
            env:
              # cloudflared -> Traefik: Traefik appends the cloudflared pod IP
              # after the visitor IP traefik-warp sets from CF-Connecting-IP,
              # so the visitor is two hops in (1 recorded the tunnel pod for
              # everyone, sharing one login rate limit)
              TRUST_PROXY_HOPS: "2"
              # Hourly snapshots, so "to now" ranges include today's gains; the
              # 00:00 one stays each day's baseline. torn-stats-tracker stays daily.
              SNAPSHOT_INTERVAL_MINUTES: "60"
            envFrom:
              - secretRef:
                  name: torn-illicit-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  # Stays 200 while Torn Stats is down
                  httpGet:
                    path: /healthz
                    port: &port 3000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
    service:
      app:
        ports:
          http:
            port: *port
    persistence:
      data:
        existingClaim: torn-illicit
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
