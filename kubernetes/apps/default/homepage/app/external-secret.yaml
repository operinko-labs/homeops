---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-external-secret
  namespace: default
spec:
  refreshInterval: 1h
  target:
    name: homepage-external-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # Technitium API token, valid on both NS1 and NS2
    - secretKey: HOMEPAGE_VAR_TECHNITIUM_API_KEY
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 36da47ee-893e-47f6-ba33-ac2c5decb2bb
        property: api-token

    # Cloudflare API token with Account > Cloudflare Tunnel > Read
    - secretKey: HOMEPAGE_VAR_CLOUDFLARED_API_TOKEN
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 4ecb8894-b8aa-41a5-96fd-9cf092bd31ae
        property: tunnel-api-token
