---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: torn-tracker-pg-s3
spec:
  refreshInterval: 1h
  target:
    name: torn-tracker-pg-s3
    creationPolicy: Owner
    deletionPolicy: Retain
  # Same Versity keys as postgres17/18 (database/cloudnative-pg-secret)
  data:
    - secretKey: aws-access-key-id
      sourceRef: &store
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: &item ed32aa71-d74b-43bc-a467-aaa2569f532f
        property: aws-access-key-id
    - secretKey: aws-secret-access-key
      sourceRef: *store
      remoteRef:
        key: *item
        property: aws-secret-access-key
