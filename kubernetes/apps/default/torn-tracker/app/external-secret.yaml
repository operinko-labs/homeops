---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: torn-tracker-secret
  namespace: default
spec:
  refreshInterval: 1h
  target:
    name: torn-tracker-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  # Shares torn-stats-tracker's item; field names are the env var names the
  # image reads, except IMPORT_TOKEN (the old tool's EXPORT_TOKEN)
  data:
    - secretKey: TORN_API_KEY
      sourceRef: &store
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: &item 95dfbd26-4d1d-43c1-b1a5-aa811b6628ca
        property: TORN_API_KEY
    - secretKey: TORNSTATS_API_KEY
      sourceRef: *store
      remoteRef:
        key: *item
        property: TORNSTATS_API_KEY
    - secretKey: FACTION_ID
      sourceRef: *store
      remoteRef:
        key: *item
        property: FACTION_ID
    - secretKey: ADMIN_PASSWORD
      sourceRef: *store
      remoteRef:
        key: *item
        property: ADMIN_PASSWORD
    - secretKey: SESSION_SECRET
      sourceRef: *store
      remoteRef:
        key: *item
        property: SESSION_SECRET
    # Cutover import only: remove once migrate has logged
    # "imported history from the old tool"
    - secretKey: IMPORT_TOKEN
      sourceRef: *store
      remoteRef:
        key: *item
        property: EXPORT_TOKEN
