---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: torn-stats-tracker
  namespace: flux-system
spec:
  targetNamespace: default
  commonMetadata:
    labels:
      app.kubernetes.io/name: torn-stats-tracker
  path: "./kubernetes/apps/default/torn-stats-tracker/app"
  prune: true
  dependsOn:
    - name: volsync
      namespace: storage
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  components:
    - ../../../../components/volsync-kopia
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: torn-stats-tracker
      VOLSYNC_COPYMETHOD: Direct
      VOLSYNC_CAPACITY: 1Gi
      VOLSYNC_STORAGECLASS: local-path
      # The image runs as node (UID/GID 1000)
      VOLSYNC_PUID: "1000"
      VOLSYNC_PGID: "1000"
