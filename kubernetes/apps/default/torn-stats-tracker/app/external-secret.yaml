---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: torn-stats-tracker-secret
  namespace: default
spec:
  refreshInterval: 1h
  target:
    name: torn-stats-tracker-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  # Field names in the item are the env var names the image reads
  data:
    - secretKey: TORNSTATS_API_KEY
      sourceRef: &store
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: &item 95dfbd26-4d1d-43c1-b1a5-aa811b6628ca
        property: TORNSTATS_API_KEY
    - secretKey: FACTION_ID
      sourceRef: *store
      remoteRef:
        key: *item
        property: FACTION_ID
    - secretKey: VIEWER_PASSWORD
      sourceRef: *store
      remoteRef:
        key: *item
        property: VIEWER_PASSWORD
    - secretKey: ADMIN_PASSWORD
      sourceRef: *store
      remoteRef:
        key: *item
        property: ADMIN_PASSWORD
    - secretKey: SESSION_SECRET
      sourceRef: *store
      remoteRef:
        key: *item
        property: SESSION_SECRET
    - secretKey: EXPORT_TOKEN
      sourceRef: *store
      remoteRef:
        key: *item
        property: EXPORT_TOKEN
