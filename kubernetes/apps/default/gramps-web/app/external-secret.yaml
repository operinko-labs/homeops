---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gramps-web-secret
  namespace: default
spec:
  refreshInterval: 1h
  target:
    name: gramps-web-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        GRAMPSWEB_SECRET_KEY: "{{ .secret_key }}"
        GRAMPSWEB_OIDC_CLIENT_ID: "{{ .oidc_client_id }}"
        GRAMPSWEB_OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
        GRAMPSWEB_EMAIL_HOST_USER: "{{ .smtp_username }}"
        GRAMPSWEB_EMAIL_HOST_PASSWORD: "{{ .smtp_password }}"
  data:
    - secretKey: secret_key
      sourceRef: &store
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: &item f81cf41d-20a9-4b04-9149-c544a09c32e5
        property: SECRET_KEY
    - secretKey: oidc_client_id
      sourceRef: *store
      remoteRef:
        key: *item
        property: OIDC_CLIENT_ID
    - secretKey: oidc_client_secret
      sourceRef: *store
      remoteRef:
        key: *item
        property: OIDC_CLIENT_SECRET
    - secretKey: smtp_username
      sourceRef: *store
      remoteRef:
        key: *item
        property: SMTP_USERNAME
    - secretKey: smtp_password
      sourceRef: *store
      remoteRef:
        key: *item
        property: SMTP_PASSWORD
