---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: image-automation
  namespace: flux-system
spec:
  decryption:
    provider: sops
  targetNamespace: flux-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: image-automation
  path: "./kubernetes/apps/flux-system/image-automation/app"
  prune: true
  dependsOn:
    # The Image* CRDs come from the reflector/automation controllers, which
    # flux-instance installs
    - name: flux-instance
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
