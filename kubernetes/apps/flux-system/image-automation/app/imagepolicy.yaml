---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/image.toolkit.fluxcd.io/imagepolicy_v1.json
# Picks the newest autoposter build. sha-<short> tags carry no order, so CI
# additionally pushes `build-<unix epoch>-sha-<short>` and the policy orders
# on the epoch. The sha-* and latest tags are ignored here but keep working
# for manual pins.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: autoposter
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: autoposter
  filterTags:
    pattern: '^build-(?P<ts>\d+)-sha-[a-f0-9]+$'
    extract: '$ts'
  policy:
    numerical:
      order: asc
