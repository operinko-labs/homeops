---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/image.toolkit.fluxcd.io/imagepolicy_v1.json
# site-overview publishes only from v* tags, as plain semver (0.1.0).
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: site-overview
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: site-overview
  policy:
    semver:
      range: ">=0.1.0"
