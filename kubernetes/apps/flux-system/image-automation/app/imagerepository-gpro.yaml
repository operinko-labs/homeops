---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/image.toolkit.fluxcd.io/imagerepository_v1.json
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: gpro-backend
  namespace: flux-system
spec:
  image: harbor.vaderrp.com/operinko-labs/gpro-backend
  interval: 1m
  secretRef:
    name: harbor-image-reflector
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/image.toolkit.fluxcd.io/imagerepository_v1.json
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: gpro-frontend
  namespace: flux-system
spec:
  image: harbor.vaderrp.com/operinko-labs/gpro-frontend
  interval: 1m
  secretRef:
    name: harbor-image-reflector
