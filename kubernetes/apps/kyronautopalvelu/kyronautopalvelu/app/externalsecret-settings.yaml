---
# Renders the full settings.local.php mounted into the php-fpm container.
# Bitwarden properties used:
#   0e8c3558-…  kyronautopalvelu_db_password  — MariaDB password (kyronautopalvelu item)
#   0e8c3558-…  kyronautopalvelu_hash_salt    — Drupal hash salt (same item)
#   00bfab9a-…  password                     — dragonfly-drupal Redis password
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kyronautopalvelu-settings-local
  namespace: kyronautopalvelu
spec:
  refreshInterval: 1h
  target:
    name: kyronautopalvelu-settings-local
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        settings.local.php: |
          <?php
          $settings['hash_salt'] = '{{ .hash_salt }}';

          $databases['default']['default'] = [
            'database'        => 'kyronautopalvelu',
            'username'        => 'kyronautopalvelu',
            'password'        => '{{ .db_password }}',
            'prefix'          => '',
            'host'            => 'mariadb-ha-primary.database.svc.cluster.local',
            'port'            => '3306',
            'isolation_level' => 'READ-COMMITTED',
            'namespace'       => 'Drupal\\mysql\\Driver\\Database\\mysql',
            'driver'          => 'mysql',
            'autoload'        => 'core/modules/mysql/src/Driver/Database/mysql/',
            'init_commands'   => [
              'isolation_level' => "SET SESSION tx_isolation='READ-COMMITTED'",
            ],
          ];

          // Skip Redis while site:install runs: the module directory exists in
          // the image before the module is installed, and loading its
          // example.services.yml then references the nonexistent redis.factory.
          if (!\Drupal\Core\Installer\InstallerKernel::installationAttempted() && file_exists($app_root . '/modules/contrib/redis')) {
            $settings['redis.connection']['interface']  = 'PhpRedis';
            // The site's own Dragonfly (drupal chart dragonfly.enabled).
            $settings['redis.connection']['host']       = 'kyronautopalvelu-dragonfly.kyronautopalvelu.svc.cluster.local';
            $settings['redis.connection']['port']       = 6379;
            $settings['redis.connection']['password']   = '{{ .redis_password }}';
            $settings['redis.connection']['persistent'] = TRUE;
            $settings['cache']['default']               = 'cache.backend.redis';
            $settings['container_yamls'][]              = 'modules/contrib/redis/example.services.yml';
            // Queues in Redis: safe now the instance is this site's alone (the
            // Redis queue's keys, drupal:queue:<name>, carry no site prefix, so
            // a shared store shares every queue). Cache mode may evict an item;
            // these queues only hold work cron can queue again.
            $settings['queue_default']                  = 'queue.redis_reliable';
            // Each release (the image tag, from the chart) caches under its
            // own prefix: during an overlapping rollout the old pod cannot
            // refill the new release's caches with old templates. A former
            // release's keys are left to Dragonfly's eviction.
            $settings['cache_prefix']                   = 'kyronautopalvelu_' . (getenv('DRUPAL_RELEASE') ?: 'local') . '_';
          }
  data:
    - secretKey: db_password
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 0e8c3558-4e73-46f8-832a-fd3315d29064
        property: kyronautopalvelu_db_password
    - secretKey: hash_salt
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 0e8c3558-4e73-46f8-832a-fd3315d29064
        property: kyronautopalvelu_hash_salt
    - secretKey: redis_password
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: ClusterSecretStore
      remoteRef:
        key: 00bfab9a-6bcf-4598-aaf6-2a65746691db
        property: password
