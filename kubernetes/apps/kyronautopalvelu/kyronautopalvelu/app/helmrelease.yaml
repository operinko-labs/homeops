apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyronautopalvelu
  namespace: kyronautopalvelu
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: drupal
    namespace: kyronautopalvelu
  values:
    initContainer:
      # The database starts empty: the init container installs the site from
      # config/sync on the first start, and from then on only updates and
      # imports. It never reinstalls a database that has tables.
      autoInstall: true
      # Imports the Finnish interface translations after every config import,
      # the theme's own translations/fi.po included.
      localeUpdate: true
    nginx:
      resources:
        limits:
          memory: 128Mi
    phpFpm:
      resources:
        requests:
          cpu: 50m
          memory: 192Mi
        limits:
          memory: 512Mi
    image:
      repository: harbor.vaderrp.com/operinko-labs/kyronautopalvelu
      # Updated by Flux image automation (ImagePolicy flux-system/kyronautopalvelu).
      # The placeholder is replaced by the first main-* build CI pushes.
      tag: main-1793035448-sha-a2ebc76 # {"$imagepolicy": "flux-system:kyronautopalvelu:tag"}
    hostname: kyronautopalvelu.fi
    wwwHostname: www.kyronautopalvelu.fi
    # The old demo host 301s everything, robots.txt included, to the apex
    # (chart >= 0.7.28), so its deny-all robots no longer exists anywhere.
    redirectHostnames:
      - kyronautopalvelu.erinko.fi
    # Plain-HTTP visitors get a 301 to HTTPS, read from Cloudflare's CF-Visitor
    # header (chart >= 0.8.3). The www and demo hosts redirect to the HTTPS
    # apex already, whatever scheme the visitor used.
    httpsRedirect: true
    cfargotunnelTarget: external.vaderrp.com
    secretName: kyronautopalvelu-settings-local
    # Drupal's syslog goes over UDP to syslog-gateway (netsyslog in the
    # drupal-php-fpm v3 image, chart >= 0.7.27); in Loki as host=kyronautopalvelu.
    syslog:
      host: syslog-gateway.observability.svc.cluster.local
    # Health check on the drupal-ping endpoint rather than the gatus-sidecar
    # default of "/".
    httproute:
      annotations:
        gatus.home-operations.com/enabled: "true"
        gatus.home-operations.com/endpoint: |
          group: Default
          url: "https://kyronautopalvelu.fi/_ping.php"
          conditions:
            - "[STATUS] == 200"
            - "[BODY] == pat(CONGRATULATIONS*)"
    # The site's own Dragonfly (chart >= 0.7.19), at
    # kyronautopalvelu-dragonfly.kyronautopalvelu.svc:6379; since 0.7.22 its
    # NetworkPolicy admits only this namespace and the operator.
    dragonfly:
      enabled: true
      passwordSecret:
        name: kyronautopalvelu-dragonfly
        key: password
    volsync:
      enabled: false
    # The files on TrueNAS over NFS (pvc-rwx.yaml), shared by the pods, so a
    # rollout starts the new pod before the old one stops (chart >= 0.8.0).
    # That needs the cache prefix keyed on DRUPAL_RELEASE (settings.local.php)
    # and Varnish emptied once the rollout is done. Backups are TrueNAS
    # snapshots of Nakkiallas/Nodepool/nfs.
    storage:
      files:
        storageClassName: tns-nfs
        accessMode: ReadWriteMany
        existingClaim: kyronautopalvelu-files-rwx
      private:
        storageClassName: tns-nfs
        accessMode: ReadWriteMany
        existingClaim: kyronautopalvelu-private-rwx
    varnish:
      banAfterRollout: true
