---
# Bitwarden fields used:
#   f7f2ed36-…  forgejo_dispatch_pat — Forgejo bot token, read access to the
#               Drupal site repos (the same one their Flux sources use)
#   3a7ed3e8-…  ntfy_token           — ntfy publish token (as Gatus uses)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: drupal-audit
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-fields
    kind: ClusterSecretStore
  target:
    name: drupal-audit
    creationPolicy: Owner
  data:
    - secretKey: FORGEJO_TOKEN
      remoteRef:
        key: f7f2ed36-37d2-438c-86b9-4e0d99c4b763
        property: forgejo_dispatch_pat
    - secretKey: NTFY_TOKEN
      remoteRef:
        key: 3a7ed3e8-9158-491b-a0c1-25a7b95ef26a
        property: ntfy_token
