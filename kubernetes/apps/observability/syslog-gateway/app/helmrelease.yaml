---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: syslog-gateway
  namespace: observability
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: syslog-gateway
  values:
    controllers:
      main:
        containers:
          app:
            image:
              repository: cr.fluentbit.io/fluent/fluent-bit
              tag: 5.1.0
            args:
              - -c
              - /fluent-bit/etc/fluent-bit.conf
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
    service:
      app:
        controller: main
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 192.168.7.6
        labels:
          io.cilium/ipam: static
        ports:
          syslog-udp:
            port: 514
            protocol: UDP
          syslog-tcp:
            port: 514
            protocol: TCP
    persistence:
      config:
        type: configMap
        name: syslog-gateway
        globalMounts:
          - path: /fluent-bit/etc
    configMaps:
      syslog-gateway-config:
        data:
          fluent-bit.conf: |
            [SERVICE]
                Flush        5
                Daemon       Off
                Log_Level    info
                Parsers_File parsers.conf
            [INPUT]
                Name         syslog
                Mode         udp
                Listen       0.0.0.0
                Port         514
                Parser       syslog-envelope
                source_address_key source_ip
                buffer_max_size 1M
                buffer_chunk_size 32k
                Tag          syslog.udp
            [INPUT]
                Name         syslog
                Mode         tcp
                Listen       0.0.0.0
                Port         514
                Parser       syslog-envelope
                source_address_key source_ip
                buffer_max_size 1M
                buffer_chunk_size 32k
                Tag          syslog.tcp
            [FILTER]
                Name         parser
                Match        syslog.*
                Key_Name     rest
                Parser       syslog-rfc5424-body
                Parser       syslog-rfc3164-body
                Reserve_Data On
                Preserve_Key Off
            [FILTER]
                Name         modify
                Match        syslog.*
                Add          cluster taloscluster
            [FILTER]
                Name         rewrite_tag
                Match        syslog.*
                Rule         $log ^CEF:.* unifi.$TAG false
                Rule         $host ^(udm|udmpro|udm-pro|unifi.*|uap.*|usw.*|usg.*)(\..*)?$ unifi.$TAG false
                Rule         $source_ip ^(udp|tcp)://192\.168\.[0-9]+\.1(?:[:][0-9]+)?$ unifi.$TAG false
                Rule         $app .*(U6|USW|USG|UDM|UniFi).* unifi.$TAG false
                Rule         $host .*(-U6|USW|USG|UDM|U6-Lite|U6-Pro|UXG|UDR).* unifi.$TAG false
            [FILTER]
                Name         parser
                Match        unifi.*
                Key_Name     log
                Parser       cef
                Reserve_Data On
                Preserve_Key On
            [OUTPUT]
                Name         loki
                Match        unifi.*
                Host         loki-gateway.observability.svc.cluster.local
                Port         80
                Labels       job=unifi, cluster=taloscluster
                Label_Keys   $host, $app
                Line_Format  json
                Retry_Limit  5
            [OUTPUT]
                Name         loki
                Match        syslog.*
                Host         loki-gateway.observability.svc.cluster.local
                Port         80
                Labels       job=syslog, cluster=taloscluster
                Label_Keys   $host, $app
                Line_Format  json
                Retry_Limit  5
          parsers.conf: |
            # Envelope: only the syslog priority; everything else is parsed by the
            # parser FILTER below, which tries RFC5424 (UniFi SIEM feed) and then
            # RFC3164 (classic BSD syslog). No Time_Key anywhere: records are stamped
            # on arrival, because RFC3164 stamps lack year and zone and Loki rejects
            # them as "too new"; the original stamp survives as the "timestamp" field.
            [PARSER]
                Name   syslog-envelope
                Format regex
                Regex  ^<(?<pri>\d+)>(?<rest>.*)$
            [PARSER]
                Name   syslog-rfc5424-body
                Format regex
                Regex  ^1\s(?<timestamp>\S+)\s(?<host>\S+)\s(?<app>\S+)\s(?<procid>\S+)\s(?<msgid>\S+)\s(?<sd>-|\[.*?\])\s?(?<log>.*)$
            [PARSER]
                Name   syslog-rfc3164-body
                Format regex
                Regex  ^(?<timestamp>[A-Z][a-z]{2}\s+\d{1,2}\s\d{2}:\d{2}:\d{2})\s(?<host>[^\s]+)\s(?<app>[^:\s]+)(?:\[(?<procid>[^\]]+)\])?:?\s?(?<log>.*)$
            [PARSER]
                Name   cef
                Format regex
                Regex  ^CEF:(?<cef>.*)$
