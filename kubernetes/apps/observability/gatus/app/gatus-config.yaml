---
web:
  port: $${WEB_PORT}
storage:
  type: sqlite
  path: /config/sqlite.db
  caching: false
metrics: true
debug: false
ui:
  title: Status | Gatus
  header: Status
connectivity:
  checker:
    target: 1.1.1.1:443
    interval: 1m
# Alerting configuration
alerting:
  ntfy:
    url: "http://ntfy.observability.svc.cluster.local:8080"
    topic: alerts
    token: $${NTFY_TOKEN}
    priority: 4
    default-alert:
      send-on-resolved: true
      failure-threshold: 3
      success-threshold: 5
  # Custom webhook for n8n alert enrichment
  custom:
    url: "http://n8n-app.tools.svc.cluster.local:5678/webhook/gatus-alerts"
    method: "POST"
    body: |
      {
        "endpoint": {
          "name": "[ENDPOINT_NAME]",
          "group": "[ENDPOINT_GROUP]",
          "url": "[ENDPOINT_URL]"
        },
        "alert": {
          "type": "[ALERT_TYPE]",
          "triggered": [ALERT_TRIGGERED_OR_RESOLVED],
          "description": "[ALERT_DESCRIPTION]"
        },
        "result": {
          "success": [RESULT_SUCCESS],
          "errors": "[RESULT_ERRORS]",
          "hostname": "[RESULT_HOSTNAME]",
          "ip": "[RESULT_IP]",
          "http_status": [RESULT_HTTP_STATUS],
          "duration_ms": [RESULT_DURATION]
        },
        "timestamp": "[TIMESTAMP]"
      }
    headers:
      Content-Type: application/json
    default-alert:
      enabled: true
      send-on-resolved: true
      failure-threshold: 2
      success-threshold: 3
endpoints:
  - name: vaderrp.com domain and expiration
    group: Domains
    url: "https://vaderrp.com"
    interval: 1h
    client:
      dns-resolver: tcp://127.0.0.1:5353
    conditions:
      - "[DOMAIN_EXPIRATION] > 720h"
      # NPMplus is on ACME_PROFILE=classic, so this is a 90-day LE cert
      - "[CERTIFICATE_EXPIRATION] > 240h"
    alerts:
      - type: ntfy
        send-on-resolved: true
        failure-threshold: 3
        success-threshold: 5
  - name: erinko.fi mail certificate
    group: Domains
    # No DOMAIN_EXPIRATION check for erinko.fi: gatus's whois library cannot
    # parse Traficom's .fi registry output (returns the MinInt64 sentinel)
    url: "https://mail.erinko.fi"
    interval: 1h
    client:
      dns-resolver: tcp://127.0.0.1:5353
    conditions:
      - "[CERTIFICATE_EXPIRATION] > 240h"
    alerts:
      - type: ntfy
        send-on-resolved: true
        failure-threshold: 3
        success-threshold: 5
  - name: shadowmorph.info domain and expiration
    group: Domains
    url: "https://shadowmorph.info"
    interval: 1h
    client:
      dns-resolver: tcp://127.0.0.1:5353
    conditions:
      - "[DOMAIN_EXPIRATION] > 720h"
      - "[CERTIFICATE_EXPIRATION] > 240h"
    alerts:
      - type: ntfy
        send-on-resolved: true
        failure-threshold: 3
        success-threshold: 5
  # Technitium runs on LXCs outside the cluster and does not issue its own
  # certificate — NPMplus does, and each node pulls the bundle from it hourly
  # (scripts/technitium-cert-sync/). These checks exist to catch that pull
  # breaking, which is otherwise invisible until DoT stops working.
  #
  # Addressed by hostname, not IP: the certificate carries only DNS SANs
  # (*.dns.vaderrp.com, dns.vaderrp.com, technitium.vaderrp.com), so verifying
  # against an IP fails with "doesn't contain any IP SANs" no matter how healthy
  # the node is. The hostnames also make this the same code path a real DoT
  # client takes.
  - name: technitium ns1 DoT certificate
    group: Network
    url: "tls://ns1.dns.vaderrp.com:853"
    interval: 1h
    conditions:
      - "[CONNECTED] == true"
      - "[CERTIFICATE_EXPIRATION] > 240h"
    alerts:
      - type: ntfy
        send-on-resolved: true
        failure-threshold: 3
        success-threshold: 5
  - name: technitium ns2 DoT certificate
    group: Network
    url: "tls://ns2.dns.vaderrp.com:853"
    interval: 1h
    conditions:
      - "[CONNECTED] == true"
      - "[CERTIFICATE_EXPIRATION] > 240h"
    alerts:
      - type: ntfy
        send-on-resolved: true
        failure-threshold: 3
        success-threshold: 5
  # The Keepalived VIP (scripts/technitium-keepalived/). This catches the one
  # failure the per-node checks structurally cannot: both nodes healthy, but the
  # VIP held by nobody — a VRRP misconfiguration, a partition where each node
  # thinks the other owns it, or keepalived simply not running on either.
  #
  # Queries a locally authoritative name rather than a recursive one, matching
  # the vrrp_script's reasoning: an upstream outage should not alert here, since
  # the VIP itself would be fine and there is nothing to fail over to.
  - name: technitium VIP
    group: Network
    url: "192.168.5.7"
    interval: 1m
    dns:
      query-name: "vaderrp.com"
      query-type: "SOA"
    conditions:
      - "[DNS_RCODE] == NOERROR"
    alerts:
      - type: ntfy
        send-on-resolved: true
        failure-threshold: 3
        success-threshold: 5
  - name: S3 gateway
    group: Storage
    url: "https://s3.vaderrp.com:9000/healthz"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 240h"
    alerts:
      - type: ntfy
        send-on-resolved: true
        failure-threshold: 3
        success-threshold: 5
  # Storj node on TrueNAS: web UI via Cloudflare (external) and local DNS (internal).
  # No QUIC check: a QUIC listener never answers Gatus's raw UDP probe, so it always times out.
  - name: Storj Web UI (external)
    group: Storage
    url: "https://storj.vaderrp.com/"
    interval: 5m
    client:
      dns-resolver: tcp://127.0.0.1:5353
      timeout: 15s
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 240h"
    alerts:
      - type: ntfy
        send-on-resolved: true
        failure-threshold: 3
        success-threshold: 5
  - name: Storj Web UI (internal)
    group: Storage
    url: "https://storj.vaderrp.com/"
    interval: 5m
    client:
      dns-resolver: tcp://192.168.5.8:53
      timeout: 15s
    conditions:
      - "[STATUS] == 200"
  - name: matrix homeserver
    group: Matrix
    url: "https://matrix.erinko.fi/_matrix/client/versions"
    interval: 5m
    client:
      dns-resolver: tcp://127.0.0.1:5353
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: ntfy
        send-on-resolved: true
        failure-threshold: 3
        success-threshold: 5
  - name: matrix well-known delegation
    group: Matrix
    url: "https://erinko.fi/.well-known/matrix/server"
    interval: 5m
    client:
      dns-resolver: tcp://127.0.0.1:5353
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*matrix.erinko.fi*)"
    alerts:
      - type: ntfy
        send-on-resolved: true
        failure-threshold: 3
        success-threshold: 5
  - name: matrix authentication service
    group: Matrix
    url: "https://account.erinko.fi/.well-known/openid-configuration"
    interval: 5m
    client:
      dns-resolver: tcp://127.0.0.1:5353
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: ntfy
        send-on-resolved: true
        failure-threshold: 3
        success-threshold: 5
  - name: element web
    group: Matrix
    url: "https://chat.erinko.fi/"
    interval: 5m
    client:
      dns-resolver: tcp://127.0.0.1:5353
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: ntfy
        send-on-resolved: true
        failure-threshold: 3
        success-threshold: 5
  - name: matrix federation
    group: Matrix
    url: "https://federationtester.matrix.org/api/report?server_name=erinko.fi"
    interval: 1h
    client:
      timeout: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].FederationOK == true"
    alerts:
      - type: ntfy
        send-on-resolved: true
        failure-threshold: 2
        success-threshold: 2
