---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus
  namespace: observability
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: gatus
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Helm values for gatus deployment
    controllers:
      gatus:
        annotations:
          reloader.stakater.com/auto: "true"
          # Exclude from Goldilocks VPA Auto mode - using custom VPA with Off mode instead
          goldilocks.fairwinds.com/vpa-update-mode: "off"
        serviceAccount:
          identifier: gatus
        containers:
          app:
            image:
              repository: ghcr.io/twin/gatus
              tag: v5.37.0@sha256:094eb186e55235db367e90e9d56140e5897b7044c41de23cde4cc18e6da1242e
            env:
              TZ: Europe/Helsinki
              GATUS_CONFIG_PATH: /config
              GATUS_DELAY_START_SECONDS: 5
              WEB_PORT: &port 8080
            envFrom:
              - secretRef:
                  name: gatus-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 23m
                memory: 122Mi
              limits:
                memory: 256Mi
                # No CPU limit - Gatus needs to burst during health check cycles (40+ endpoints)
          gatus-sidecar:
            image:
              repository: ghcr.io/home-operations/gatus-sidecar
              tag: latest
            args:
              - --enable-httproute
              - --auto-httproute
              - --enable-ingress=false
              - --auto-ingress=false
              - --output=/config/gatus-sidecar.yaml
            resources:
              requests:
                cpu: 10m
                memory: 100Mi
              limits:
                memory: 100Mi
          # Public-view DNS for the "external" checks and the gateway leak check.
          # Plain :53 to public resolvers is DNAT'd to Technitium on the UDM, so
          # those lookups go out as DoH instead (gatus-config.yaml: 127.0.0.1:5353).
          doh-proxy:
            image:
              repository: docker.io/adguard/dnsproxy
              tag: v0.86.0@sha256:4d65bafbf246b206a1af35d4263a86c35451d957458c7836304199f1cd2c1535
            args:
              - --listen=127.0.0.1
              - --port=5353
              - --upstream=https://1.1.1.1/dns-query
              - --upstream=https://1.0.0.1/dns-query
            # The image's binary carries file capability cap_net_bind_service;
            # with no_new_privs or without that cap in the bounding set the
            # kernel refuses to exec it ("operation not permitted").
            securityContext:
              allowPrivilegeEscalation: true
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"], add: ["NET_BIND_SERVICE"]}
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: gatus
        ports:
          http:
            port: 80
            targetPort: *port
    serviceMonitor:
      app:
        serviceName: gatus
        endpoints:
          - port: http
    serviceAccount:
      gatus: {}
    persistence:
      config:
        existingClaim: gatus
      config-file:
        type: configMap
        name: gatus-config
        globalMounts:
          - path: /config/config.yaml
            subPath: config.yaml
            readOnly: true
