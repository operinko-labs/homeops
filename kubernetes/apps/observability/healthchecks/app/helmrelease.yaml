---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: healthchecks
  namespace: observability
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: healthchecks
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      healthchecks:
        containers:
          app:
            image:
              repository: docker.io/healthchecks/healthchecks
              tag: v4.4@sha256:aa08a61b0dcfd83f1332eab195d5cec1b595ae076eb8388cadf8a3d597114f9b
            env:
              TZ: Europe/Helsinki
              SITE_ROOT: https://healthchecks.vaderrp.com
              SITE_NAME: Healthchecks
              ALLOWED_HOSTS: healthchecks.vaderrp.com
              DB: sqlite
              DB_NAME: /data/hc.sqlite
              REGISTRATION_OPEN: "False"
              DEBUG: "False"
              # Allow webhook/ntfy integrations targeting in-cluster services
              INTEGRATIONS_ALLOW_PRIVATE_IPS: "True"
            envFrom:
              - secretRef:
                  name: healthchecks-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8000
                    httpHeaders:
                      - name: Host
                        value: healthchecks.vaderrp.com
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
    service:
      app:
        controller: healthchecks
        ports:
          http:
            port: *port
    persistence:
      data:
        existingClaim: healthchecks
        globalMounts:
          - path: /data
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
