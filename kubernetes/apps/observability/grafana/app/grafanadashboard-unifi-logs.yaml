---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: unifi-logs
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  json: |
    {
      "title": "UniFi Network Logs",
      "uid": "unifi-logs",
      "description": "UDM Pro Max System Logging / SIEM feed (CEF over syslog) as stored in Loki: threats, firewall blocks, client and device events. Filter by host, category and free text.",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "1m",
      "timezone": "browser",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "timepicker": {},
      "tags": [
        "unifi",
        "loki",
        "logs",
        "security"
      ],
      "editable": true,
      "graphTooltip": 1,
      "links": [],
      "annotations": {
        "list": []
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "pluginId": "loki",
            "label": "Datasource",
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "options": [],
            "query": "loki",
            "refresh": 1,
            "regex": ""
          },
          {
            "name": "host",
            "type": "query",
            "label": "Console / host",
            "datasource": {
              "type": "loki",
              "uid": "${datasource}"
            },
            "definition": "label_values({job=\"unifi\"}, host)",
            "query": "label_values({job=\"unifi\"}, host)",
            "sort": 1,
            "refresh": 2,
            "hide": 0,
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "options": [],
            "current": {}
          },
          {
            "name": "product",
            "type": "custom",
            "label": "Product",
            "hide": 0,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "query": "UniFi Network,UniFi OS,UniFi Protect",
            "options": [],
            "current": {
              "text": "All",
              "value": "$__all"
            }
          },
          {
            "name": "category",
            "type": "custom",
            "label": "Category",
            "hide": 0,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "query": "detection,iot,siteActivity,adminActivity,system,Security,Device,Client,Triggers,Updates,Admin Activity,Critical,VPN,Firewall Default Policy",
            "options": [],
            "current": {
              "text": "All",
              "value": "$__all"
            }
          },
          {
            "name": "search",
            "type": "textbox",
            "label": "Search (regex)",
            "hide": 0,
            "query": "",
            "current": {
              "text": "",
              "value": ""
            },
            "options": []
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Events in range",
          "datasource": {
            "type": "loki",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${datasource}"
              },
              "expr": "sum(count_over_time({job=\"unifi\", host=~\"$host\"} | json | line_format \"{{.cef}}\" | regexp `^(?P<cef_ver>[^|]*)\\|(?P<vendor>[^|]*)\\|(?P<product>[^|]*)\\|(?P<version>[^|]*)\\|(?P<sig_id>[^|]*)\\|(?P<event>[^|]*)\\|(?P<severity>[^|]*)\\|(?P<ext>.*)$` | regexp `UNIFIcategory=(?P<category>\\S+)` | regexp `UNIFIsubCategory=(?P<subcategory>\\S+)` | regexp `UNIFIdeviceName=(?P<device>.*?) UNIFI` | regexp `msg=\"?(?P<msg>[^\"]*)\"?$` | product=~\"$product\" | category=~\"$category\" |~ \"(?i)$search\" [$__range]))",
              "refId": "A",
              "legendFormat": "",
              "queryType": "instant",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "justifyMode": "auto",
            "orientation": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Security events",
          "datasource": {
            "type": "loki",
            "uid": "${datasource}"
