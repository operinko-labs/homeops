              "expr": "{job=\"unifi\", host=~\"$host\"} | json | line_format \"{{.cef}}\" | regexp `^(?P<cef_ver>[^|]*)\\|(?P<vendor>[^|]*)\\|(?P<product>[^|]*)\\|(?P<version>[^|]*)\\|(?P<sig_id>[^|]*)\\|(?P<event>[^|]*)\\|(?P<severity>[^|]*)\\|(?P<ext>.*)$` | regexp `UNIFIcategory=(?P<category>\\S+)` | regexp `UNIFIsubCategory=(?P<subcategory>\\S+)` | regexp `UNIFIdeviceName=(?P<device>.*?) UNIFI` | regexp `msg=\"?(?P<msg>[^\"]*)\"?$` | product=~\"$product\" | category=~\"$category\" |~ \"(?i)$search\" | line_format \"{{.utc_time}} [{{.category}}/{{.subcategory}}] {{.event}} (sev {{.severity}}) {{.device}} :: {{.msg}}\"",
