              "expr": "sum by (category) (count_over_time({job=\"unifi\", host=~\"$host\"} | json | line_format \"{{.cef}}\" | regexp `^(?P<cef_ver>[^|]*)\\|(?P<vendor>[^|]*)\\|(?P<product>[^|]*)\\|(?P<version>[^|]*)\\|(?P<sig_id>[^|]*)\\|(?P<event>[^|]*)\\|(?P<severity>[^|]*)\\|(?P<ext>.*)$` | regexp `UNIFIcategory=(?P<category>\\S+)` | regexp `UNIFIsubCategory=(?P<subcategory>\\S+)` | regexp `UNIFIdeviceName=(?P<device>.*?) UNIFI` | regexp `msg=\"?(?P<msg>[^\"]*)\"?$` | product=~\"$product\" | category=~\"$category\" |~ \"(?i)$search\" [$__auto]))",
              "refId": "A",
              "legendFormat": "{{category}}",
              "queryType": "range"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 80,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                },
                "lineWidth": 1
              },
              "unit": "short",
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          }
