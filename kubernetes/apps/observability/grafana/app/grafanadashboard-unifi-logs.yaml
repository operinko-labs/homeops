          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${datasource}"
              },
              "expr": "sum(count_over_time({job=\"unifi\", host=~\"$host\"} | json | line_format \"{{.cef}}\" | regexp `^(?P<cef_ver>[^|]*)\\|(?P<vendor>[^|]*)\\|(?P<product>[^|]*)\\|(?P<version>[^|]*)\\|(?P<sig_id>[^|]*)\\|(?P<event>[^|]*)\\|(?P<severity>[^|]*)\\|(?P<ext>.*)$` | regexp `UNIFIcategory=(?P<category>\\S+)` | regexp `UNIFIsubCategory=(?P<subcategory>\\S+)` | regexp `UNIFIdeviceName=(?P<device>.*?) UNIFI` | regexp `msg=\"?(?P<msg>[^\"]*)\"?$` | product=~\"$product\" | category=~\"$category\" |~ \"(?i)$search\" | category=~\"(?i)security\" [$__range]))",
              "refId": "A",
              "legendFormat": "",
              "queryType": "instant",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "justifyMode": "auto",
            "orientation": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "orange",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
