---
# ntfy publish token for Alertmanager's ntfy receiver (the token drupal-audit
# and Gatus use; Bitwarden 3a7ed3e8-… ntfy_token).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-ntfy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-fields
    kind: ClusterSecretStore
  target:
    name: alertmanager-ntfy
    creationPolicy: Owner
  data:
    - secretKey: ntfy_token
      remoteRef:
        key: 3a7ed3e8-9158-491b-a0c1-25a7b95ef26a
        property: ntfy_token
