---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: observability
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Helm values for kube-prometheus-stack deployment
    crds:
      enabled: true
      upgradeJob:
        enabled: true
        forceConflicts: true
    cleanPrometheusOperatorObjectNames: true
    defaultRules:
      disabled:
        # Duplicate of the homeops-owned ContainerWaiting rule (same metric,
        # stricter 15m threshold, kometa queue exclusion) in alertrules-pod-health.yaml
        KubeContainerWaiting: true
    # Prometheus Operator config-reloader resources (applies to both alertmanager and prometheus sidecars)
    prometheusOperator:
      priorityClassName: system-cluster-critical
      prometheusConfigReloader:
        resources:
          requests:
            cpu: 10m
            memory: 100Mi
          limits:
            memory: 100Mi
      alertmanagerConfigReloader:
        resources:
          requests:
            cpu: 10m
            memory: 100Mi
          limits:
            memory: 100Mi
    # Alertmanager configuration
    # Uses AlertmanagerConfig CRD per namespace with ClusterExternalSecrets for credentials
    # Log-aggregator webhook is configured globally here since it doesn't need secrets
    alertmanager:
      alertmanagerSpec:
        priorityClassName: system-cluster-critical
        resources:
          requests:
            cpu: 10m
            memory: 100Mi
          limits:
            memory: 100Mi
        # Select AlertmanagerConfigs with the release label
        alertmanagerConfigSelector:
          matchLabels:
            release: kube-prometheus-stack
        # Don't add namespace matchers - allows cross-namespace alert routing
        alertmanagerConfigMatcherStrategy:
          type: None
        # Look in all namespaces for AlertmanagerConfig CRDs
        alertmanagerConfigNamespaceSelector: {}
        # Mounted at /etc/alertmanager/secrets/alertmanager-ntfy/ (ntfy receiver below)
        secrets:
          - alertmanager-ntfy
      config:
        global:
          resolve_timeout: 5m
        route:
          receiver: "null"
          group_by: ["alertname", "namespace"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
          routes:
            - matchers:
                - alertname = "Watchdog"
              receiver: "null"
            - matchers:
                - alertname = "InfoInhibitor"
              receiver: "null"
            # site-overview (tools) alerts go to ntfy once a day until fixed,
            # one message per alert name (all sites together, so a rule that
            # fires everywhere is one notification, not one per site);
            # `continue` lets log-aggregator record them too.
            - matchers:
                - app = "site-overview"
              receiver: "ntfy"
              group_by: ["alertname"]
              group_interval: 15m
              repeat_interval: 24h
              continue: true
            # Log aggregator captures all alerts for AI analysis
            - receiver: "log-aggregator"
              continue: true
        inhibit_rules:
          - source_matchers:
              - severity = "critical"
            target_matchers:
              - severity =~ "warning|info"
            equal: ["namespace", "alertname"]
          - source_matchers:
              - severity = "warning"
            target_matchers:
              - severity = "info"
            equal: ["namespace", "alertname"]
          - source_matchers:
              - alertname = "InfoInhibitor"
            target_matchers:
              - severity = "info"
            equal: ["namespace"]
        receivers:
          - name: "null"
          - name: "log-aggregator"
            webhook_configs:
              - url: "http://log-aggregator.tools.svc.cluster.local:8080/api/alert"
                send_resolved: true
          - name: "ntfy"
            webhook_configs:
              # ntfy inline templates (tpl=yes) over the webhook JSON, URL-encoded:
              #   t: [Resolved: ]<alertname>[ (<n>)]
              #   m: one line per alert, its summary (prefixed "resolved: " when
              #      resolved), at most 10, then a pointer to site-overview.
              # The built-in "alertmanager" template printed every label and the
              # generator URL per alert, which made one message per site screens long.
              - url: "http://ntfy.observability.svc.cluster.local:8080/alerts?tpl=yes&t=%7B%7Bif%20eq%20.status%20%22resolved%22%7D%7DResolved%3A%20%7B%7Bend%7D%7D%7B%7B.commonLabels.alertname%7D%7D%7B%7Bif%20gt%20%28len%20.alerts%29%201%7D%7D%20%28%7B%7Blen%20.alerts%7D%7D%29%7B%7Bend%7D%7D&m=%7B%7Brange%20%24i%2C%20%24a%20%3A%3D%20.alerts%7D%7D%7B%7Bif%20lt%20%24i%2010%7D%7D%7B%7Bif%20eq%20%24a.status%20%22resolved%22%7D%7Dresolved%3A%20%7B%7Bend%7D%7D%7B%7B%24a.annotations.summary%7D%7D%0A%7B%7Bend%7D%7D%7B%7Bend%7D%7D%7B%7Bif%20gt%20%28len%20.alerts%29%2010%7D%7Dand%20more%20on%20https%3A%2F%2Fsite-overview.vaderrp.com%2F%7B%7Bend%7D%7D&click=https%3A%2F%2Fsite-overview.vaderrp.com%2F&tags=site-overview"
                send_resolved: true
                http_config:
                  authorization:
                    type: Bearer
                    credentials_file: /etc/alertmanager/secrets/alertmanager-ntfy/ntfy_token
    kubeEtcd:
      service:
        selector:
          component: kube-apiserver
    kubeProxy:
      enabled: false
    prometheus:
      ingress:
        enabled: false
      prometheusSpec:
        priorityClassName: system-cluster-critical
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        podAntiAffinity: ""
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                      - key: cnpg.io/podRole
                        operator: In
                        values: ["primary"]
                  topologyKey: kubernetes.io/hostname
        serviceMonitorSelectorNilUsesHelmValues: false
        enableAdminAPI: true
        walCompression: true
        enableFeatures:
          - memory-snapshot-on-shutdown
        # Native histograms are stable in Prometheus 3 but scraping them is opt-in.
        # Keep classic buckets too so existing rules and dashboards keep working
        # while the same metrics are also stored as native histograms.
        scrapeNativeHistograms: true
        scrapeClassicHistograms: true
        evaluationInterval: 1m
        retention: 14d
        retentionSize: 32GB
        externalLabels:
          cluster: Executor
        # Increase probe timeouts to prevent CrashLoopBackoff during chunk snapshot operations
        # Using strategic merge patch to override probe configuration
        containers:
          - name: prometheus
            livenessProbe:
              timeoutSeconds: 10
              periodSeconds: 10
              failureThreshold: 6 # Allow 60s of failures before restart
            readinessProbe:
              timeoutSeconds: 10
              periodSeconds: 10
              failureThreshold: 3 # Allow 30s of failures before marking unready
            startupProbe:
              timeoutSeconds: 10
              periodSeconds: 15
              failureThreshold: 60 # Allow 15 minutes for startup
        resources:
          requests:
            cpu: 617m
            memory: 4275Mi
          limits:
            cpu: 1500m
            memory: 6Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              resources:
                requests:
                  storage: 50Gi
    prometheus-node-exporter:
      fullnameOverride: node-exporter
      prometheus:
        monitor:
          enabled: true
          relabelings:
            - action: replace
              regex: (.*)
              replacement: $1
              sourceLabels: ["__meta_kubernetes_pod_node_name"]
              targetLabel: kubernetes_node
    kube-state-metrics:
      resources:
        requests:
          cpu: 31m
          memory: 256Mi
        limits:
          memory: 384Mi
      fullnameOverride: kube-state-metrics
      metricLabelsAllowlist:
        - pods=[*]
        - deployments=[*]
        - persistentvolumeclaims=[*]
      prometheus:
        monitor:
          enabled: true
          relabelings:
            - action: replace
              regex: (.*)
              replacement: $1
              sourceLabels: ["__meta_kubernetes_pod_node_name"]
              targetLabel: kubernetes_node
    grafana:
      enabled: false
      forceDeployDashboards: true
    additionalPrometheusRulesMap:
      dockerhub-rules:
        groups:
          - name: dockerhub
            rules:
              - alert: DockerhubRateLimitRisk
                annotations:
                  summary: Kubernetes cluster Dockerhub rate limit risk
                expr: count(time() - container_last_seen{image=~"(docker.io).*",container!=""} < 30) > 100
                labels:
                  severity: critical
      oom-rules:
        groups:
          - name: oom
            rules:
              - alert: OomKilled
                annotations:
                  summary: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
                expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
                labels:
                  severity: critical
      zfs-rules:
        groups:
          - name: zfs
            rules:
              - alert: ZfsUnexpectedPoolState
                annotations:
                  summary: ZFS pool {{$labels.zpool}} on {{$labels.instance}} is in a unexpected state {{$labels.state}}
                expr: node_zfs_zpool_state{state!="online"} > 0
                labels:
                  severity: critical
