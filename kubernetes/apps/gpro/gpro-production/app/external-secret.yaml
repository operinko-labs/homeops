---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gpro-secret
  namespace: gpro
spec:
  refreshInterval: 1h
  target:
    name: gpro-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # postgres-init variables
        INIT_POSTGRES_HOST: "postgres17-rw.database.svc.cluster.local."
        INIT_POSTGRES_SUPER_PASS: "{{ .super_password }}"
        INIT_POSTGRES_USER: "{{ .username }}"
        INIT_POSTGRES_PASS: "{{ .password }}"
        INIT_POSTGRES_DBNAME: "{{ .database }}"
        # PostgreSQL environment variables
        POSTGRESDB_HOST: "postgres17-rw.database.svc.cluster.local."
        POSTGRESDB_PORT: "5432"
        POSTGRESDB_DATABASE: "{{ .database }}"
        POSTGRESDB_USER: "{{ .username }}"
        POSTGRESDB_PASSWORD: "{{ .password }}"
        # Redis URL and Password
        REDIS_URL: "dragonfly.database.svc.cluster.local."
        REDIS_PASSWORD: "{{ .redis_password }}"
        QUEUE_PREFIX: "gpro-prod"
        # SMTP configuration for password reset emails
        SMTP_HOST: "{{ .smtp_host }}"
        SMTP_PORT: "{{ .smtp_port }}"
        SMTP_USER: "{{ .smtp_user }}"
        SMTP_PASS: "{{ .smtp_pass }}"
        SMTP_FROM_EMAIL: "{{ .smtp_from_email }}"
        SMTP_FROM_NAME: "{{ .smtp_from_name }}"
        ALERT_EMAIL: "{{ .alert_email }}"
        # JWT signing secret
        JWT_SECRET: "{{ .jwt_secret }}"
        # Cron Scheduler Auth
        CRON_SECRET: "{{ .cron_secret }}"
        # Pushover configuration
        PUSHOVER_USER: "{{ .pushover_user }}"
        PUSHOVER_TOKEN: "{{ .pushover_token }}"
  data:
    # PostgreSQL superuser password (for init container)
    - secretKey: super_password
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: ClusterSecretStore
      remoteRef:
        key: e59d0e4b-ae12-4fd4-94c7-a746d7544274
        property: password
    # gpro PostgreSQL credentials from Vaultwarden
    - secretKey: database
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: ClusterSecretStore
      remoteRef:
        key: 115bd411-22e4-40d1-80be-638cfcd345e6
        property: username
    - secretKey: username
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: ClusterSecretStore
      remoteRef:
        key: 115bd411-22e4-40d1-80be-638cfcd345e6
        property: username
    - secretKey: password
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: ClusterSecretStore
      remoteRef:
        key: 115bd411-22e4-40d1-80be-638cfcd345e6
        property: password
    # Redis (Dragonfly) password
    - secretKey: redis_password
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: ClusterSecretStore
      remoteRef:
        key: 00bfab9a-6bcf-4598-aaf6-2a65746691db
        property: password
    # SMTP configuration
    - secretKey: smtp_host
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 115bd411-22e4-40d1-80be-638cfcd345e6
        property: SMTP_HOST
    - secretKey: smtp_port
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 115bd411-22e4-40d1-80be-638cfcd345e6
        property: SMTP_PORT
    - secretKey: smtp_user
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 115bd411-22e4-40d1-80be-638cfcd345e6
        property: SMTP_USER
    - secretKey: smtp_pass
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 115bd411-22e4-40d1-80be-638cfcd345e6
        property: SMTP_PASSWORD
    - secretKey: smtp_from_email
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 115bd411-22e4-40d1-80be-638cfcd345e6
        property: SMTP_FROM_EMAIL
    - secretKey: smtp_from_name
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 115bd411-22e4-40d1-80be-638cfcd345e6
        property: SMTP_FROM_NAME
    # Alert configuration
    - secretKey: alert_email
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 115bd411-22e4-40d1-80be-638cfcd345e6
        property: ALERT_EMAIL
    # Pushover configuration
    - secretKey: pushover_user
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: bc506d55-fb13-4a17-9506-593d6eaa87b7
        property: pushover_user
    - secretKey: pushover_token
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: bc506d55-fb13-4a17-9506-593d6eaa87b7
        property: pushover_token
    # JWT signing secret
    - secretKey: jwt_secret
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 115bd411-22e4-40d1-80be-638cfcd345e6
        property: JWT_SECRET
    # Cron Scheduler Auth
    - secretKey: cron_secret
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 115bd411-22e4-40d1-80be-638cfcd345e6
        property: CRON_SECRET
