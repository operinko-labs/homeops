apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gpro.fullname" . }}-frontend
  labels:
    {{- include "gpro.componentLabels" (dict "context" . "component" "frontend") | nindent 4 }}
spec:
  {{- if not .Values.frontend.autoscaling.enabled }}
  replicas: {{ .Values.frontend.replicas }}
  {{- end }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "gpro.componentSelectorLabels" (dict "context" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gpro.componentSelectorLabels" (dict "context" . "component" "frontend") | nindent 8 }}
    spec:
      {{- include "gpro.podDnsConfig" . | nindent 6 }}
      containers:
        - name: frontend
          image: {{ include "gpro.image" (dict "root" . "image" .Values.images.frontend) }}
          imagePullPolicy: {{ .Values.images.frontend.pullPolicy }}
          env:
            - name: BACKEND_SERVICE_NAME
              value: {{ default (printf "%s-backend" (include "gpro.fullname" .)) .Values.frontend.backendServiceName }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
