apiVersion: v1
kind: Service
metadata:
  name: {{ include "gpro.fullname" . }}-backend
  labels:
    {{- include "gpro.componentLabels" (dict "context" . "component" "backend") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "gpro.componentSelectorLabels" (dict "context" . "component" "backend") | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
    # In-cluster /status for site-overview; no HTTPRoute targets it.
    - name: status
      port: 9095
      targetPort: 9095
      protocol: TCP
