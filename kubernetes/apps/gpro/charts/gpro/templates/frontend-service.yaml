apiVersion: v1
kind: Service
metadata:
  name: {{ include "gpro.fullname" . }}-frontend
  labels:
    {{- include "gpro.componentLabels" (dict "context" . "component" "frontend") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "gpro.componentSelectorLabels" (dict "context" . "component" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
