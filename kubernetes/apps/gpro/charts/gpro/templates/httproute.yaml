{{- if and .Values.httpRoute.enabled .Values.httpRoute.hostnames }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ default (include "gpro.fullname" .) .Values.httpRoute.name | quote }}
  labels:
    {{- include "gpro.labels" . | nindent 4 }}
    {{- with .Values.httpRoute.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: {{ include "gpro.fullname" . }}-backend
          port: 3000
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
    - matches:
        - path:
            type: Exact
            value: /health
      backendRefs:
        - name: {{ include "gpro.fullname" . }}-backend
          port: 3000
    - matches:
        - path:
            type: PathPrefix
            value: /ws
      backendRefs:
        - name: {{ include "gpro.fullname" . }}-backend
          port: 3000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "gpro.fullname" . }}-frontend
          port: 80
{{- end }}
