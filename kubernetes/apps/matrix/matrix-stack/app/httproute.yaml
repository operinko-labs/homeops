      backendRefs:
        - name: matrix-element-web
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: well-known
  labels:
    route.scope: external
  annotations:
    external-dns.alpha.kubernetes.io/target: external.vaderrp.com
    # gatus-config.yaml checks /.well-known/matrix/server; the auto check probes
    # the first match (the JMAP redirect to mail.erinko.fi)
    gatus.home-operations.com/enabled: "false"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-public
      namespace: network
  hostnames:
    - erinko.fi
  rules:
    # JMAP clients discover the server from the address's domain (RFC 8620);
    # without this they follow the chat.erinko.fi redirect and get Element's HTML
    - matches:
        - path: {type: Exact, value: /.well-known/jmap}
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: mail.erinko.fi
            statusCode: 301
    # ESS HAProxy serves /.well-known/matrix/* and redirects everything else
    # to chat.erinko.fi
    - matches:
        - path: {type: PathPrefix, value: /}
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: traefik-warp
      backendRefs:
        - name: matrix-well-known
          port: 8010
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matrix-rtc
  labels:
    route.scope: external
  annotations:
    external-dns.alpha.kubernetes.io/target: external.vaderrp.com
    # The auto check probes /sfu/get, which is POST-only (405); LiveKit's root
    # answers 200
    gatus.home-operations.com/enabled: "true"
    gatus.home-operations.com/endpoint: |
      group: Matrix
      url: "https://mrtc.erinko.fi/"
      conditions:
        - "[STATUS] == 200"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-public
      namespace: network
  hostnames:
    - mrtc.erinko.fi
  rules:
    - matches:
        - path: {type: PathPrefix, value: /sfu/get}
        - path: {type: PathPrefix, value: /get_token}
        - path: {type: PathPrefix, value: /delegate_delayed_leave}
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: traefik-warp
      backendRefs:
        - name: matrix-matrix-rtc-authorisation-service
          port: 8080
    # LiveKit signalling websocket
    - matches:
        - path: {type: PathPrefix, value: /}
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: traefik-warp
      backendRefs:
        - name: matrix-matrix-rtc-sfu
          port: 7880
---
# LAN-only: gateway-internal, no public DNS record (same as flux.vaderrp.com)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: element-admin
  labels:
    route.scope: internal
  annotations:
    external-dns.alpha.kubernetes.io/public: "false"
spec:
  parentRefs:
    - name: gateway-internal
      namespace: network
  hostnames:
    - matrix-admin.vaderrp.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: matrix-element-admin
          port: 8080
