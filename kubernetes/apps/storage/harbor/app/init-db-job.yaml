---
apiVersion: batch/v1
kind: Job
metadata:
  name: harbor-init-db
  namespace: storage
spec:
  template:
    spec:
      containers:
        - name: init-db
          image: ghcr.io/home-operations/postgres-init:18.7@sha256:6d4cfa4b8d343eb6fa0de8dd9ec416a2007f346bb631fc8e246e1f39eee6c4aa
          env:
            - name: INIT_POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: harbor-secret
                  key: INIT_POSTGRES_HOST
            - name: INIT_POSTGRES_SUPER_USER
              valueFrom:
                secretKeyRef:
                  name: harbor-secret
                  key: INIT_POSTGRES_SUPER_USER
            - name: INIT_POSTGRES_SUPER_PASS
              valueFrom:
                secretKeyRef:
                  name: harbor-secret
                  key: INIT_POSTGRES_SUPER_PASS
            - name: INIT_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: harbor-secret
                  key: INIT_POSTGRES_USER
            - name: INIT_POSTGRES_PASS
              valueFrom:
                secretKeyRef:
                  name: harbor-secret
                  key: INIT_POSTGRES_PASS
            - name: INIT_POSTGRES_DBNAME
              valueFrom:
                secretKeyRef:
                  name: harbor-secret
                  key: INIT_POSTGRES_DBNAME
      restartPolicy: OnFailure
  backoffLimit: 6
