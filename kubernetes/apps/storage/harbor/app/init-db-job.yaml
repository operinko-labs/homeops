---
apiVersion: batch/v1
kind: Job
metadata:
  name: harbor-init-db
  namespace: storage
  annotations:
    # A Job's pod template is immutable: recreate it when the image changes.
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  template:
    spec:
      containers:
        - name: init-db
          image: ghcr.io/home-operations/postgres-init:19.0@sha256:b49e2f1f373d932ab41614633ac89fa506e5d21bb13cc18d9c96ca026e51f502
          env:
            - name: INIT_POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: harbor-secret
                  key: INIT_POSTGRES_HOST
            - name: INIT_POSTGRES_SUPER_USER
              valueFrom:
                secretKeyRef:
                  name: harbor-secret
                  key: INIT_POSTGRES_SUPER_USER
            - name: INIT_POSTGRES_SUPER_PASS
              valueFrom:
                secretKeyRef:
                  name: harbor-secret
                  key: INIT_POSTGRES_SUPER_PASS
            - name: INIT_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: harbor-secret
                  key: INIT_POSTGRES_USER
            - name: INIT_POSTGRES_PASS
              valueFrom:
                secretKeyRef:
                  name: harbor-secret
                  key: INIT_POSTGRES_PASS
            - name: INIT_POSTGRES_DBNAME
              valueFrom:
                secretKeyRef:
                  name: harbor-secret
                  key: INIT_POSTGRES_DBNAME
      restartPolicy: OnFailure
  backoffLimit: 6
