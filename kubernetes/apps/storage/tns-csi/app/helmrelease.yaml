---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tns-csi
  namespace: storage
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: tns-csi
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    namespace: storage
    truenas:
      existingSecret: tns-csi-secret
    grafana:
      dashboards:
        enabled: true
    snapshots:
      enabled: true
    node:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
    storageClasses:
      - name: tns-iscsi
        enabled: true
        protocol: iscsi
        pool: Nakkiallas
        parentDataset: Nakkiallas/Nodepool/iscsi
        server: truenas.vaderrp.com
        port: "3260"
        fsType: ext4
        reclaimPolicy: Delete
        volumeBindingMode: Immediate
        allowVolumeExpansion: true
        parameters:
          zfs.compression: lz4
      # Shared (ReadWriteMany) volumes: iSCSI is a block device, one node
      # at a time, so anything several pods mount at once is NFS. The
      # dataset stays on TrueNAS when its claim goes (deleteStrategy), and
      # is named after the claim so it is recognisable there.
      - name: tns-nfs
        enabled: true
        protocol: nfs
        pool: Nakkiallas
        parentDataset: Nakkiallas/Nodepool/nfs
        server: truenas.vaderrp.com
        reclaimPolicy: Delete
        deleteStrategy: retain
        volumeBindingMode: Immediate
        allowVolumeExpansion: true
        nameTemplate: "{{ .PVCNamespace }}-{{ .PVCName }}"
        commentTemplate: "{{ .PVCNamespace }}/{{ .PVCName }}"
        parameters:
          zfs.compression: lz4
