---
apiVersion: v1
kind: ConfigMap
metadata:
  name: minio-gdrive-sync-script
data:
  sync.sh: |
    #!/bin/sh
    set -eu

    # rclone crypt requires obscured passwords in config
    PASS=$(rclone obscure "$ENCRYPTION_PASSWORD")
    SALT=$(rclone obscure "$ENCRYPTION_SALT")

    # GDRIVE_TOKEN must be the single-line JSON from `rclone authorize "drive"`
    cat > /tmp/rclone.conf <<EOF
    [s3]
    type = s3
    provider = Other
    endpoint = https://s3.vaderrp.com:9000
    region = us-east-1
    access_key_id = $S3_ACCESS_KEY
    secret_access_key = $S3_SECRET_KEY

    [gdrive]
    type = drive
    scope = drive
    client_id = $GDRIVE_CLIENT_ID
    client_secret = $GDRIVE_CLIENT_SECRET
    token = $GDRIVE_TOKEN

    [crypt]
    type = crypt
    remote = gdrive:TrueNAS/MinIO
    filename_encryption = off
    directory_name_encryption = false
    password = $PASS
    password2 = $SALT
    EOF

    rc=0
    for bucket in $BUCKETS; do
      echo "=== syncing $bucket ==="
      rclone --config /tmp/rclone.conf sync "s3:$bucket" "crypt:$bucket" \
        --fast-list --transfers 4 --stats 1m --stats-log-level NOTICE || rc=1
    done
    exit $rc
