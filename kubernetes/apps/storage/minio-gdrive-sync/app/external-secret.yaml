---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-gdrive-sync
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-fields
    kind: ClusterSecretStore
  target:
    name: minio-gdrive-sync
    creationPolicy: Owner
  data:
    - secretKey: ENCRYPTION_PASSWORD
      remoteRef:
        key: 980055b1-e67e-43b3-8634-87545f4cce16
        property: encryption_password
    - secretKey: ENCRYPTION_SALT
      remoteRef:
        key: 980055b1-e67e-43b3-8634-87545f4cce16
        property: encryption_salt
    - secretKey: GDRIVE_TOKEN
      remoteRef:
        key: 980055b1-e67e-43b3-8634-87545f4cce16
        property: gdrive_token
    - secretKey: GDRIVE_CLIENT_ID
      remoteRef:
        key: 980055b1-e67e-43b3-8634-87545f4cce16
        property: rclone_client_id
    - secretKey: GDRIVE_CLIENT_SECRET
      remoteRef:
        key: 980055b1-e67e-43b3-8634-87545f4cce16
        property: rclone_client_secret
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: 9ae12023-3bdf-48b3-a626-f47044c6f43b
        property: gdrive_sync_access_key
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: 9ae12023-3bdf-48b3-a626-f47044c6f43b
        property: gdrive_sync_secret_key
