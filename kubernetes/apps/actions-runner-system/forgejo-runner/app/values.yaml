---
# Helm values for the in-cluster forgejo-runner (app-template deployment).
#
# No first-party Helm chart exists for forgejo-runner at code.forgejo.org (only
# the Forgejo server chart lives there); community charts aren't first-party
# per repo convention, so this uses the repo's standard app-template fallback
# instead of a hand-rolled Deployment (no raw `kind: Deployment` manifest
# exists anywhere else in this repo).
#
# Runs in host mode (label "cluster:host" — no docker socket, no
# docker-in-docker): jobs execute directly in this container via a shell,
# using whatever `node` binary the runner itself finds to run JS-based
# actions.
#
# The upstream forgejo-runner image is Alpine/musl-based, but
# actions/setup-python (and likely setup-node) only publish glibc builds —
# confirmed by a real run failing with "version not found for alpine
# 3.23.5". The forgejo-runner binary itself is a fully static Go build
# (`-extldflags "-static"`, see its Makefile), so an initContainer copies
# just the binary out of the upstream image onto a Debian-based main
# container instead of chasing musl compatibility shims.
#
# The main image is node:22-bookworm (not plain debian:bookworm-slim):
# Debian bookworm's apt-installed nodejs is v18, and the actions toolkit's
# JS runtime requires the `File` global added in Node 20 — confirmed by a
# real run failing at "Install uv" with `ReferenceError: File is not
# defined`. node:22-bookworm ships Node 22 directly, so nothing needs
# installing for that baseline.
#
# actions/setup-python is NOT used by the schemas workflow: on this host
# platform it reports available versions as "not found for debian 12" for
# every spec tried (3.14.x, 3.x), so python3 is installed straight from
# apt instead and `uv pip install --system` (UV_SYSTEM_PYTHON=1 in the
# workflow env) targets it directly.
controllers:
  forgejo-runner:
    annotations:
      reloader.stakater.com/auto: "true"
    strategy: Recreate
    serviceAccount:
      identifier: forgejo-runner
    initContainers:
      install-runner-binary:
        image:
          repository: code.forgejo.org/forgejo/runner
          tag: "13.1.0"
        command: ["/bin/sh", "-c"]
        args:
          - cp /bin/forgejo-runner /shared/forgejo-runner && chmod +x /shared/forgejo-runner
    containers:
      app:
        image:
          repository: docker.io/library/node
          tag: 24-bookworm
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -eu
            export PATH="/shared:$PATH"
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends \
              curl git ca-certificates tini python3
            if [ ! -s /data/.runner ]; then
              forgejo-runner register --no-interactive \
                --config /etc/forgejo-runner/config.yaml \
                --instance https://forgejo.vaderrp.com \
                --token "$FORGEJO_RUNNER_TOKEN" \
                --name cluster-runner \
                --labels "cluster:host"
            fi
            exec tini -- forgejo-runner daemon --config /etc/forgejo-runner/config.yaml
        env:
          FORGEJO_RUNNER_TOKEN:
            valueFrom:
              secretKeyRef:
                name: forgejo-runner-secret
                key: token
        probes:
          liveness:
            enabled: false
          readiness:
            enabled: false
        securityContext:
          # Root is required to `apt-get install` the tooling above into the
          # image at startup; the namespace's pod-security label is already
          # "privileged" (see kustomization.yaml), so this doesn't cross a
          # cluster policy boundary.
          runAsUser: 0
          runAsGroup: 0
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 2Gi
persistence:
  data:
    type: persistentVolumeClaim
    existingClaim: forgejo-runner-data
    globalMounts:
      - path: /data
  config:
    type: configMap
    name: forgejo-runner-config
    globalMounts:
      - path: /etc/forgejo-runner/config.yaml
        subPath: config.yaml
        readOnly: true
  runner-bin:
    type: emptyDir
    globalMounts:
      - path: /shared
serviceAccount:
  forgejo-runner: {}
