---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/fluxcd.controlplane.io/resourceset_v1.json
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: medikabalans-admin
  namespace: medikabalans
  annotations:
    fluxcd.controlplane.io/reconcile: "enabled"
    fluxcd.controlplane.io/reconcileEvery: "5m"
    fluxcd.controlplane.io/reconcileTimeout: "10m"
spec:
  inputsFrom:
    - kind: ResourceSetInputProvider
      name: medikabalans-admin-branches
  resources:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      metadata:
        name: medikabalans-admin-<< inputs.branch >>
        namespace: medikabalans
      spec:
        interval: 1m
        url: https://forgejo.vaderrp.com/operinko-labs/medikabalans-admin.git
        ref:
          branch: << inputs.branch >>
        secretRef:
          name: medikabalans-admin-forgejo-pat

    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: medikabalans-admin-<< inputs.branch >>
        namespace: medikabalans
      spec:
        interval: 5m
        prune: true
        wait: true
        # timeout must stay well under interval. With both at 5m, a health
        # check that ran to timeout consumed the whole interval, so the next
        # reconcile started the instant the previous one gave up — the
        # Kustomization never left Reconciling and never showed a settled
        # failure. retryInterval is explicit for the same reason: it defaults
        # to interval, and the gap after a failure is the point.
        timeout: 2m
        retryInterval: 5m
        force: true
        decryption:
          provider: sops
        sourceRef:
          kind: GitRepository
          name: medikabalans-admin-<< inputs.branch >>
        path: ./deploy/k8s/overlays/<< inputs.branch >>
