---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-pull-secret
  namespace: medikabalans
spec:
  refreshInterval: 1h
  target:
    name: harbor-pull-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: '{"auths":{"harbor.vaderrp.com":{"username":"robot$cluster-puller","password":"{{ .robot_secret }}"}}}'
  data:
    - secretKey: robot_secret
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 84fb75c3-a5fd-4c28-97d3-ca0a4d240ef5
        property: robot_secret
