---
# Password for the site's own Dragonfly instance (the drupal chart's
# dragonfly.passwordSecret). Bitwarden: the dragonfly-drupal login item's
# password, the same one settings.local.php connects with.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: medikabalans-dragonfly
  namespace: medikabalans
spec:
  refreshInterval: 1h
  target:
    name: medikabalans-dragonfly
    creationPolicy: Owner
  data:
    - secretKey: password
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: ClusterSecretStore
      remoteRef:
        key: 00bfab9a-6bcf-4598-aaf6-2a65746691db
        property: password
