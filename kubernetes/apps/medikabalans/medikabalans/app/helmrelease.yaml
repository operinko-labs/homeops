apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: medikabalans-admin
  namespace: medikabalans
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: drupal
    namespace: medikabalans
  values:
    nginx:
      resources:
        limits:
          memory: 128Mi
    phpFpm:
      resources:
        requests:
          cpu: 50m
          memory: 192Mi
        limits:
          memory: 512Mi
    image:
      repository: harbor.vaderrp.com/operinko-labs/medikabalans
      # Updated by Flux image automation (ImagePolicy flux-system/medikabalans)
      tag: main-1790099351-sha-8e88df2 # {"$imagepolicy": "flux-system:medikabalans:tag"}
    hostname: medikabalans.erinko.fi
    # The real domain, ahead of the cutover: the demo host stays the primary
    # (probes, cron, sitemap) until DNS moves; www redirects to the apex.
    extraHostnames:
      - medikabalans.fi
    wwwHostname: www.medikabalans.fi
    wwwRedirectHostname: medikabalans.fi
    cfargotunnelTarget: external.vaderrp.com
    secretName: medikabalans-admin-settings-local
    # The front page is now the public site's home, so override the
    # gatus-sidecar auto-generated "/" check with the drupal-ping endpoint,
    # which is the actual health check.
    httproute:
      annotations:
        gatus.home-operations.com/enabled: "true"
        gatus.home-operations.com/endpoint: |
          group: Default
          url: "https://medikabalans.erinko.fi/_ping.php"
          conditions:
            - "[STATUS] == 200"
            - "[BODY] == pat(CONGRATULATIONS*)"
    volsync:
      enabled: false
