apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: medikabalans-admin
  namespace: medikabalans
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: drupal
    namespace: medikabalans
  values:
    nginx:
      resources:
        limits:
          memory: 128Mi
    phpFpm:
      resources:
        requests:
          cpu: 50m
          memory: 192Mi
        limits:
          memory: 512Mi
      # php-fpm itself runs as www-data, so `kubectl exec` lands as the pool
      # user and nothing done there leaves root-owned files (chart >= 0.7.26;
      # the image has no root-only entrypoint since syslog went over UDP).
      securityContext:
        runAsUser: 82
        runAsGroup: 82
    # Drupal's syslog goes over UDP to the gateway (netsyslog in the
    # drupal-php-fpm v3 image), host label medikabalans-admin in Loki.
    syslog:
      host: syslog-gateway.observability.svc.cluster.local
    image:
      repository: harbor.vaderrp.com/operinko-labs/medikabalans
      # Updated by Flux image automation (ImagePolicy flux-system/medikabalans)
      tag: main-1793035449-sha-f5ece77 # {"$imagepolicy": "flux-system:medikabalans:tag"}
    hostname: medikabalans.fi
    wwwHostname: www.medikabalans.fi
    # The old demo host 301s everything, robots.txt included, to the apex
    # (chart >= 0.7.28), so its deny-all robots no longer exists anywhere.
    redirectHostnames:
      - medikabalans.erinko.fi
    # Plain-HTTP visitors get a 301 to HTTPS, read from Cloudflare's CF-Visitor
    # header (chart >= 0.8.3). The www and demo hosts redirect to the HTTPS
    # apex already, whatever scheme the visitor used.
    httpsRedirect: true
    cfargotunnelTarget: external.vaderrp.com
    secretName: medikabalans-admin-settings-local
    # drush (init container and cron job) runs as php-fpm's www-data, so what
    # it creates in the files volume stays writable for the site: as root it
    # left the image style and upload folders unwritable (chart >= 0.7.25;
    # the files volume was chowned to 82 on 2026-09-28).
    drushSecurityContext:
      runAsUser: 82
      runAsGroup: 82
    # The front page is now the public site's home, so override the
    # gatus-sidecar auto-generated "/" check with the drupal-ping endpoint,
    # which is the actual health check.
    httproute:
      annotations:
        gatus.home-operations.com/enabled: "true"
        gatus.home-operations.com/endpoint: |
          group: Default
          url: "https://medikabalans.fi/_ping.php"
          conditions:
            - "[STATUS] == 200"
            - "[BODY] == pat(CONGRATULATIONS*)"
    volsync:
      enabled: false
    # The files on TrueNAS over NFS (pvc-rwx.yaml), shared by the pods, so a
    # rollout starts the new pod before the old one stops (chart >= 0.8.0).
    # That needs the cache prefix keyed on DRUPAL_RELEASE (settings.local.php)
    # and Varnish emptied once the rollout is done. Backups are TrueNAS
    # snapshots of Nakkiallas/Nodepool/nfs.
    storage:
      files:
        storageClassName: tns-nfs
        accessMode: ReadWriteMany
        existingClaim: medikabalans-files-rwx
      private:
        storageClassName: tns-nfs
        accessMode: ReadWriteMany
        existingClaim: medikabalans-private-rwx
    varnish:
      banAfterRollout: true
    # The site's own Dragonfly (chart >= 0.7.19), at
    # medikabalans-admin-dragonfly.medikabalans.svc:6379.
    dragonfly:
      enabled: true
      passwordSecret:
        name: medikabalans-dragonfly
        key: password
