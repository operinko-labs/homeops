---
# Renders the full settings.local.php mounted into the php-fpm container.
# Bitwarden properties used:
#   da9e8c72-…  medikabalans_db_password      — MariaDB password (medikabalans item)
#   da9e8c72-…  medikabalans_admin_hash_salt  — Drupal hash salt (same item, different
#                property)
#   00bfab9a-…  password                      — dragonfly-drupal Redis password
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: medikabalans-admin-settings-local
  namespace: medikabalans
spec:
  refreshInterval: 1h
  target:
    name: medikabalans-admin-settings-local
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # envFrom turns every key that is a valid identifier into an
        # environment variable, which is how settings.php sees this one: it
        # activates the "demo" config split, so nothing on the demo host is
        # indexed. Drop the key when the site goes live. (settings.local.php
        # is not a valid identifier, so it is only mounted as a file.)
        MEDIKABALANS_DEMO: "1"
        settings.local.php: |
          <?php
          $settings['hash_salt'] = '{{ .hash_salt }}';

          $databases['default']['default'] = [
            'database'        => 'medikabalans',
            'username'        => 'medikabalans',
            'password'        => '{{ .db_password }}',
            'prefix'          => '',
            'host'            => 'mariadb-ha-primary.database.svc.cluster.local',
            'port'            => '3306',
            'isolation_level' => 'READ-COMMITTED',
            'namespace'       => 'Drupal\\mysql\\Driver\\Database\\mysql',
            'driver'          => 'mysql',
            'autoload'        => 'core/modules/mysql/src/Driver/Database/mysql/',
            'init_commands'   => [
              'isolation_level' => "SET SESSION tx_isolation='READ-COMMITTED'",
            ],
          ];

          // Skip Redis while site:install runs: the module directory exists in
          // the image before the module is installed, and loading its
          // example.services.yml then references the nonexistent redis.factory.
          if (!\Drupal\Core\Installer\InstallerKernel::installationAttempted() && file_exists($app_root . '/modules/contrib/redis')) {
            $settings['redis.connection']['interface']  = 'PhpRedis';
            $settings['redis.connection']['host']       = 'dragonfly-drupal.database.svc.cluster.local';
            $settings['redis.connection']['port']       = 6379;
            $settings['redis.connection']['password']   = '{{ .redis_password }}';
            $settings['redis.connection']['persistent'] = TRUE;
            $settings['cache']['default']               = 'cache.backend.redis';
            $settings['container_yamls'][]              = 'modules/contrib/redis/example.services.yml';
            $settings['queue_default']                  = 'queue.redis_reliable';
            $settings['cache_prefix']                   = 'medikabalans_';
          }
  data:
    - secretKey: db_password
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: da9e8c72-9c23-4ec7-ad11-fd1316139555
        property: medikabalans_db_password
    - secretKey: hash_salt
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: da9e8c72-9c23-4ec7-ad11-fd1316139555
        property: medikabalans_admin_hash_salt
    - secretKey: redis_password
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: ClusterSecretStore
      remoteRef:
        key: 00bfab9a-6bcf-4598-aaf6-2a65746691db
        property: password
