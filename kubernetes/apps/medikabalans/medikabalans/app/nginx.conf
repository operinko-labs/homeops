# Serves the built site out of the git-sync worktree.
#
# git-sync keeps /www/current pointing at a complete checkout of the `dist`
# branch and only moves the symlink once a fetch has fully landed, so nginx
# never serves a half-written page. `root` is re-resolved per request, which
# is what makes the swap visible without a reload.
#
# add_header does not inherit into a location that declares its own, so the
# three security headers are repeated in every such block.

server {
    listen 8080;
    server_name _;

    root /www/current;
    index index.html;

    # Emit relative Location headers. nginx would otherwise build directory
    # redirects from what it sees locally (http, port 8080) and send browsers
    # to the wrong origin. A relative redirect keeps the client's scheme,
    # host and port.
    absolute_redirect off;

    # Demo hostname: keep it out of search engines. Remove the X-Robots-Tag
    # lines and the robots.txt location when the site moves to its
    # production domain.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /robots.txt {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Liveness/readiness. Answered by nginx itself so it stays up even if the
    # worktree is missing, which matters when debugging git-sync.
    location = /healthz {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # The worktree carries a .git pointer file; never serve dotfiles.
    location ~ /\. {
        deny all;
    }

    # Astro writes content-hashed assets here; a changed file gets a new name.
    # ^~ keeps the regex rules below from overriding this prefix.
    location ^~ /_astro/ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(png|webp|ico|svg)$ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Never cache HTML: a new build has to show on the next refresh. Every
    # route is a directory with an index.html, so this covers all pages.
    location ~* \.html$ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
