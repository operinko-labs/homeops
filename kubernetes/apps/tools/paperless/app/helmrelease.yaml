---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless
  namespace: tools
spec:
  interval: 15m
  # Matches the startup probe below: a migrating upgrade must not time out
  # and roll back to a version that can't read the migrated schema.
  timeout: 20m
  chartRef:
    kind: OCIRepository
    name: paperless
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      paperless:
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: "18.7@sha256:6d4cfa4b8d343eb6fa0de8dd9ec416a2007f346bb631fc8e246e1f39eee6c4aa"
            envFrom: &envFrom
              - secretRef:
                  name: paperless-secret
              - secretRef:
                  name: paperless-external-secret
        containers:
          app:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: 3.5.1@sha256:8508853b8a0f8394074260957d0be186c8c64f346973b24a7583de4580f306b9
            env:
              PAPERLESS_URL: https://paperless.vaderrp.com
              PAPERLESS_TIME_ZONE: Europe/Helsinki
              PAPERLESS_DBHOST: postgres17-rw.database.svc.cluster.local.
              PAPERLESS_DBNAME: paperless
              PAPERLESS_OCR_LANGUAGE: fin+eng
              PAPERLESS_OCR_LANGUAGES: fin
              PAPERLESS_TASK_WORKERS: "2"
              USERMAP_UID: "1000"
              USERMAP_GID: "1000"
            envFrom: *envFrom
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8000
                    # 3.5 enforces ALLOWED_HOSTS (from PAPERLESS_URL); a probe
                    # by pod IP gets 400 DisallowedHost.
                    httpHeaders: &host
                      - name: Host
                        value: paperless.vaderrp.com
                  initialDelaySeconds: 60
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              # Version upgrades run Django migrations before the web server
              # answers. A failed upgrade rolls back to a version that can't
              # read the migrated schema (2026-11-19, 3.3 -> 3.5), so allow up
              # to 20 min to come up.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                    httpHeaders: *host
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 120
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 3Gi
    service:
      app:
        controller: paperless
        ports:
          http:
            port: *port
    persistence:
      data:
        existingClaim: paperless
        globalMounts:
          - path: /usr/src/paperless/data
            subPath: data
          - path: /usr/src/paperless/media
            subPath: media
          - path: /usr/src/paperless/export
            subPath: export
          - path: /usr/src/paperless/consume
            subPath: consume
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
