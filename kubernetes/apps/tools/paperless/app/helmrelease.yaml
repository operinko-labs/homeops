---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless
  namespace: tools
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: paperless
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      paperless:
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: "18.6"
            envFrom: &envFrom
              - secretRef:
                  name: paperless-secret
              - secretRef:
                  name: paperless-external-secret
        containers:
          app:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: 3.1.3@sha256:aa810a36942c63d4ee70d00eda7236cd3d6acfb7eb3f7987fb568ed14df8817a
            env:
              PAPERLESS_URL: https://paperless.vaderrp.com
              PAPERLESS_TIME_ZONE: Europe/Helsinki
              PAPERLESS_DBHOST: postgres17-rw.database.svc.cluster.local.
              PAPERLESS_DBNAME: paperless
              PAPERLESS_OCR_LANGUAGE: fin+eng
              PAPERLESS_OCR_LANGUAGES: fin
              PAPERLESS_TASK_WORKERS: "2"
              USERMAP_UID: "1000"
              USERMAP_GID: "1000"
            envFrom: *envFrom
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8000
                  initialDelaySeconds: 60
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 3Gi
    service:
      app:
        controller: paperless
        ports:
          http:
            port: *port
    persistence:
      data:
        existingClaim: paperless
        globalMounts:
          - path: /usr/src/paperless/data
            subPath: data
          - path: /usr/src/paperless/media
            subPath: media
          - path: /usr/src/paperless/export
            subPath: export
          - path: /usr/src/paperless/consume
            subPath: consume
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
