---
# tainer 2.0 refuses to boot without AUTH_SECRET. The first start with it set
# re-encrypts everything under the old generated /app/data/auth-secret.txt, so
# this value must never change or be lost.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tainer-secret
  namespace: tools
spec:
  refreshInterval: 1h
  target:
    name: tainer-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        AUTH_SECRET: "{{ .auth_secret }}"
  data:
    - secretKey: auth_secret
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 079fcb2d-fb4f-4c80-a42d-5207077f6bc5
        property: AUTH_SECRET
