---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: tools
spec:
  interval: 30m
  chart:
    spec:
      chart: headlamp
      version: 0.45.0
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: flux-system # Requires adding repo
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Helm values for headlamp deployment
    config:
      pluginsDir: /build/plugins
    fullnameOverride: headlamp
    serviceAccount:
      create: false
      name: headlamp-admin
    clusterRoleBinding:
      create: false
    persistentVolumeClaim:
      existingClaim: headlamp
    podAnnotations:
      reloader.stakater.com/auto: "true"
    volumeMounts:
      - mountPath: /build/plugins
        name: headlamp-plugins
    volumes:
      - name: headlamp-plugins
        persistentVolumeClaim:
          claimName: headlamp
