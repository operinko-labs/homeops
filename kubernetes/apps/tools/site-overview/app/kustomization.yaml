---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tools
resources:
  - ocirepository.yaml
  - helmrelease.yaml
  - externalsecret.yaml
  - rbac.yaml
  - httproute.yaml
  - prometheusrule.yaml

configMapGenerator:
  - name: site-overview-values
    files:
      - values.yaml
    options:
      disableNameSuffixHash: true
  # The sites the collector watches (format: the site-overview repo's
  # config.py). Reloader restarts the pod when it changes.
  - name: site-overview-sites
    files:
      - sites.yaml
    options:
      disableNameSuffixHash: true
