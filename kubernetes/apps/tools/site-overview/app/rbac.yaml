---
# Read-only: the inventory lists pods in each site namespace. No exec, no logs
# (logs come from Loki), no secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: site-overview-pod-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: site-overview-pod-reader
subjects:
  - kind: ServiceAccount
    name: site-overview
    namespace: tools
roleRef:
  kind: ClusterRole
  name: site-overview-pod-reader
  apiGroup: rbac.authorization.k8s.io
