---
# Bitwarden items used:
#   2d1a7479-…  site-overview         — postgres_user / postgres_password (and the sg_key_* fields Plan 2 uses)
#   ed32aa71-…  postgres superuser    — password (postgres-init only)
#   f7f2ed36-…  shared creds          — forgejo_dispatch_pat (read access to the site repos)
#   84fb75c3-…  harbor                — robot_secret (robot$cluster-puller)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: site-overview-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-fields
    kind: ClusterSecretStore
  target:
    name: site-overview-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SITE_OVERVIEW_DATABASE_URL: "postgresql+asyncpg://{{ .postgres_user }}:{{ .postgres_password }}@postgres17-rw.database.svc.cluster.local:5432/site_overview"
        SITE_OVERVIEW_FORGEJO_TOKEN: "{{ .forgejo_token }}"
        SITE_OVERVIEW_HARBOR_PASSWORD: "{{ .harbor_password }}"
  data:
    - secretKey: postgres_user
      remoteRef:
        key: 2d1a7479-495c-4fd5-9f73-ab0ac314788a
        property: postgres_user
    - secretKey: postgres_password
      remoteRef:
        key: 2d1a7479-495c-4fd5-9f73-ab0ac314788a
        property: postgres_password
    - secretKey: forgejo_token
      remoteRef:
        key: f7f2ed36-37d2-438c-86b9-4e0d99c4b763
        property: forgejo_dispatch_pat
    - secretKey: harbor_password
      remoteRef:
        key: 84fb75c3-a5fd-4c28-97d3-ca0a4d240ef5
        property: robot_secret
---
# postgres-init creates the role and database on postgres17 at every start
# (idempotent); only the init container sees the superuser password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: site-overview-init-db
spec:
  refreshInterval: 1h
  target:
    name: site-overview-init-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        INIT_POSTGRES_HOST: postgres17-rw.database.svc.cluster.local
        INIT_POSTGRES_SUPER_PASS: "{{ .super_password }}"
        INIT_POSTGRES_USER: "{{ .postgres_user }}"
        INIT_POSTGRES_PASS: "{{ .postgres_password }}"
        INIT_POSTGRES_DBNAME: site_overview
  data:
    - secretKey: super_password
      sourceRef:
        storeRef:
          name: bitwarden-login
          kind: ClusterSecretStore
      remoteRef:
        key: ed32aa71-d74b-43bc-a467-aaa2569f532f
        property: password
    - secretKey: postgres_user
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 2d1a7479-495c-4fd5-9f73-ab0ac314788a
        property: postgres_user
    - secretKey: postgres_password
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 2d1a7479-495c-4fd5-9f73-ab0ac314788a
        property: postgres_password
