---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: site-overview
  namespace: tools
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: site-overview
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: site-overview-values
