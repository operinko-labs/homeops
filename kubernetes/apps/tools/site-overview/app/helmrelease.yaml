---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: site-overview
  namespace: tools
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: site-overview
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Source: forgejo operinko-labs/site-overview. Releases are v* tags; Flux image
    # automation (ImagePolicy flux-system/site-overview) bumps the tag below.
    controllers:
      site-overview:
        annotations:
          reloader.stakater.com/auto: "true"
        serviceAccount:
          identifier: site-overview
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: "18.7@sha256:6d4cfa4b8d343eb6fa0de8dd9ec416a2007f346bb631fc8e246e1f39eee6c4aa"
            envFrom:
              - secretRef:
                  name: site-overview-init-db
        containers:
          app:
            image:
              repository: harbor.vaderrp.com/operinko-labs/site-overview
              tag: 0.4.2 # {"$imagepolicy": "flux-system:site-overview:tag"}
            env:
              TZ: Europe/Helsinki
              SITE_OVERVIEW_SITES_FILE: /config/sites.yaml
              SITE_OVERVIEW_PUBLIC_URL: https://site-overview.vaderrp.com
              SITE_OVERVIEW_FORGEJO_URL: https://forgejo.vaderrp.com
              SITE_OVERVIEW_HARBOR_URL: https://harbor.vaderrp.com
              SITE_OVERVIEW_HARBOR_USERNAME: robot$cluster-puller
              SITE_OVERVIEW_LOKI_URL: http://loki-gateway.observability.svc.cluster.local
              SITE_OVERVIEW_GRAFANA_URL: https://grafana.vaderrp.com
            envFrom:
              - secretRef:
                  name: site-overview-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8080
                  initialDelaySeconds: 20
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 20m
                memory: 128Mi
              limits:
                memory: 384Mi
    defaultPodOptions:
      # The pod-reader ClusterRole needs the service-account token.
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
    serviceAccount:
      site-overview: {}
    service:
      app:
        controller: site-overview
        ports:
          http:
            port: *port
    serviceMonitor:
      app:
        serviceName: site-overview
        endpoints:
          - port: http
            # The app's own `container` label (runtime metrics) must not be
            # renamed to exported_container by the pod's target label.
            honorLabels: true
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 30s
    persistence:
      sites:
        type: configMap
        name: site-overview-sites
        globalMounts:
          - path: /config/sites.yaml
            subPath: sites.yaml
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
