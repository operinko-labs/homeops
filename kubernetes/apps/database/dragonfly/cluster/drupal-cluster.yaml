---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/dragonflydb.io/dragonfly_v1alpha1.json
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: dragonfly-drupal
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  image: ghcr.io/dragonflydb/dragonfly:v2.1.0@sha256:94891bb22ce2fb0f7a5a3ff1bb3b2fbbc5830e2523293e47723d87fa3e5b1184
  replicas: 2
  args:
    # Kept below the container limit: at maxmemory == limit the shared cluster
    # OOMKilled during a failover resync (2026-11-23), since replication
    # buffers and fragmentation sit on top of the dataset. 512Mi is the floor
    # (Dragonfly wants 256MiB per proactor thread), so the limit grows instead.
    - --maxmemory=512Mi
    - --cache_mode
    - --proactor_threads=2
    - --cluster_mode=emulated
  authentication:
    passwordFromSecret:
      name: dragonfly-secret
      key: password
  nodeSelector:
    node-role.kubernetes.io/bulk-storage: "true"
  resources:
    requests:
      cpu: 100m
    limits:
      cpu: 500m
      memory: 640Mi
