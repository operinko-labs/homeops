---
# yaml-language-server: $schema=https://crd.movishell.pl/postgresql.cnpg.io/database_v1.json
# Synapse refuses to start on a database whose collation/ctype is not C
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: synapse-db
  namespace: database
spec:
  name: synapse
  owner: synapse
  cluster:
    name: postgres18
  encoding: UTF8
  localeCollate: C
  localeCType: C
  template: template0
---
# yaml-language-server: $schema=https://crd.movishell.pl/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: mas-db
  namespace: database
spec:
  name: mas
  owner: mas
  cluster:
    name: postgres18
