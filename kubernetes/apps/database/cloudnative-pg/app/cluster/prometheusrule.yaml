---
# yaml-language-server: $schema=https://crd.movishell.pl/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: postgres-v1-alerts
spec:
  groups:
    - name: cnp-default.rules
      rules:
        - alert: LongRunningTransaction
          annotations:
            description: Pod {{ $labels.pod }} is taking more than 5 minutes (300 seconds) for a query.
            summary: A query is taking longer than 5 minutes.
          expr: |-
            cnpg_backends_max_tx_duration_seconds > 300
          for: 1m
          labels:
            severity: warning
        - alert: BackendsWaiting
          annotations:
            description: Pod {{ $labels.pod  }} has been waiting for longer than 5 minutes
            summary: If a backend is waiting for longer than 5 minutes
          expr: |-
            cnpg_backends_waiting_total > 300
          for: 1m
          labels:
            severity: warning
        - alert: PGDatabase
          annotations:
            description: Over 150,000,000 transactions from frozen xid on pod {{ $labels.pod  }}
            summary: Number of transactions from the frozen XID to the current one
          expr: |-
            cnpg_pg_database_xid_age > 150000000
          for: 1m
          labels:
            severity: warning
        - alert: PGReplication
          annotations:
            description: Standby is lagging behind by over 300 seconds (5 minutes)
            summary: The standby is lagging behind the primary
          expr: |-
            cnpg_pg_replication_lag > 300
          for: 1m
          labels:
            severity: warning
        - alert: LastFailedArchiveTime
          annotations:
            description: Archiving failed for {{ $labels.pod }}
            summary: Checks the last time archiving failed. Will be < 0 when it has not failed.
          expr: |-
            (cnpg_pg_stat_archiver_last_failed_time - cnpg_pg_stat_archiver_last_archived_time) > 1
          for: 1m
          labels:
            severity: warning
        - alert: DatabaseDeadlockConflicts
          annotations:
            description: There are over 10 deadlock conflicts in {{ $labels.pod }}
            summary: Checks the number of database conflicts
          expr: |-
            cnpg_pg_stat_database_deadlocks > 10
          for: 1m
          labels:
            severity: warning
        - alert: ReplicaFailingReplication
          annotations:
            description: Replica {{ $labels.pod }} is failing to replicate
            summary: Checks if the replica is failing to replicate
          expr: |-
            cnpg_pg_replication_in_recovery > cnpg_pg_replication_is_wal_receiver_up
          for: 1m
          labels:
            severity: warning
        # postgres18 hit 100% on 2026-10-23 (Synapse) with no warning first
        - alert: DatabaseVolumeFilling
          annotations:
            description: PVC {{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full
            summary: A database volume is filling up
          expr: |-
            kubelet_volume_stats_used_bytes{namespace="database"} / kubelet_volume_stats_capacity_bytes{namespace="database"} > 0.75
          for: 15m
          labels:
            severity: warning
        - alert: DatabaseVolumeAlmostFull
          annotations:
            description: PVC {{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full; Postgres stops at 100%
            summary: A database volume is almost full
          expr: |-
            kubelet_volume_stats_used_bytes{namespace="database"} / kubelet_volume_stats_capacity_bytes{namespace="database"} > 0.90
          for: 5m
          labels:
            severity: critical
        - alert: SynapseDatabaseGrowingFast
          annotations:
            description: The synapse database is growing by {{ $value | humanize1024 }}B/day (6h trend); check joined rooms and the state compressor
            summary: Synapse database growth is abnormal
          expr: |-
            deriv(cnpg_pg_database_size_bytes{datname="synapse"}[6h]) * 86400 > 1e9
          for: 1h
          labels:
            severity: warning
