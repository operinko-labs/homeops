---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: torn-tracker-pg-user
  namespace: database
spec:
  refreshInterval: 1h
  target:
    name: torn-tracker-pg-user
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: torn_tracker
        password: "{{ .db_password }}"
  # The app's DATABASE_URL (torn-tracker/torn-tracker-secret) reads the same field
  data:
    - secretKey: db_password
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 95dfbd26-4d1d-43c1-b1a5-aa811b6628ca
        property: psql_password
