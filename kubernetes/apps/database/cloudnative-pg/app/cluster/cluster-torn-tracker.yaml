---
# yaml-language-server: $schema=https://crd.movishell.pl/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: torn-tracker-pg
  namespace: database
spec:
  instances: 1
  # TimescaleDB comes from the extension image below (mounted as an image
  # volume); the base image must share its Debian suite (trixie)
  imageName: ghcr.io/cloudnative-pg/postgresql:18-minimal-trixie
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: restart
  storage:
    size: 20Gi
    storageClass: tns-iscsi
    resizeInUseVolumes: true

  postgresUID: 26
  postgresGID: 26

  bootstrap:
    initdb:
      database: torn_tracker
      owner: torn_tracker
      secret:
        name: torn-tracker-pg-user

  # Keeps the role's password in step with Vaultwarden after bootstrap
  managed:
    roles:
      - name: torn_tracker
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        passwordSecret:
          name: torn-tracker-pg-user

  postgresql:
    shared_preload_libraries:
      - timescaledb
    extensions:
      - name: timescaledb-oss
        image:
          reference: ghcr.io/cloudnative-pg/timescaledb-oss:2.30.1-18-trixie
    parameters:
      timescaledb.telemetry_level: "off"
      max_locks_per_transaction: "128"
      max_connections: "100"
      shared_buffers: 128MB
      archive_timeout: "60"
  enablePDB: false
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/bulk-storage
                operator: In
                values:
                  - "true"
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
  monitoring:
    enablePodMonitor: true

  env:
    - name: AWS_DEFAULT_REGION
      value: "us-east-1"
    - name: AWS_REGION
      value: "us-east-1"
    - name: AWS_S3_FORCE_PATH_STYLE
      value: "true"

  plugins:
    - enabled: true
      isWALArchiver: true
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: torn-tracker-pg
        serverName: torn-tracker-pg-v2
