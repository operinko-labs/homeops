---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres18-synapse-user
  namespace: database
spec:
  refreshInterval: 1h
  target:
    name: postgres18-synapse-user
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: synapse
        password: "{{ .db_password }}"
  data:
    - secretKey: db_password
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 9389193a-b36b-4605-9dcd-0ba52c3f8d54
        property: synapse_db_password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres18-mas-user
  namespace: database
spec:
  refreshInterval: 1h
  target:
    name: postgres18-mas-user
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: mas
        password: "{{ .db_password }}"
  data:
    - secretKey: db_password
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 9389193a-b36b-4605-9dcd-0ba52c3f8d54
        property: mas_db_password
