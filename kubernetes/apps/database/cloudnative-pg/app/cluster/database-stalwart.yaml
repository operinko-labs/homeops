---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: stalwart-db
  namespace: database
spec:
  name: stalwart
  owner: stalwart
  cluster:
    name: postgres18
  schemas:
    - name: directory
      owner: stalwart
---
# Target of the 0.16 -> 1.0 migration (docs/superpowers/plans/2026-10-27-stalwart-1.0-migration.md).
# stalwart-migrate requires a new, empty database. The SQL directory stays in
# the directory schema of the stalwart database above.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: stalwart-v1-db
  namespace: database
spec:
  name: stalwart_v1
  owner: stalwart
  cluster:
    name: postgres18
