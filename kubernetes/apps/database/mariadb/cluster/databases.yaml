---
# hietamakidojo (suspended client, domain lapsed 2026). The User and Grant were
# removed with the rest of their resources; this schema is kept deliberately so
# the site can be restored if they come back. Nothing references it — do not
# "clean up" as an orphan.
#
# Every Database, User and Grant here sets cleanupPolicy: Skip, so deleting the
# CR leaves the schema, user or grant in place. The mariadb-ha cutover relies on
# this: mariaDbRef is immutable, so moving a resource to another MariaDB means
# deleting and recreating its CR.
apiVersion: k8s.mariadb.com/v1alpha1
kind: Database
metadata:
  name: aikido8
  namespace: database
spec:
  cleanupPolicy: Skip
  mariaDbRef:
    name: mariadb-ha
  name: aikido8
  characterSet: utf8mb4
  collate: utf8mb4_unicode_ci
