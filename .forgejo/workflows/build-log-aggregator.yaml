---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build Log Aggregator

on:
  push:
    branches:
      - main
    paths:
      - "apps/log-aggregator/**"
      - ".forgejo/workflows/build-log-aggregator.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/log-aggregator/**"
  workflow_dispatch:
    inputs:
      force_push:
        description: "Force push image even on PR"
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: operinko-labs/log-aggregator

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve Harbor registry host
        run: |
          echo "REGISTRY=$(echo "${{ secrets.HARBOR_URL }}" | sed -E 's#^[a-zA-Z]+://##; s#/+$##')" >> "$GITHUB_ENV"

      - name: Read version from VERSION file
        id: version
        run: |
          VERSION=$(cat apps/log-aggregator/VERSION | tr -d '[:space:]')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Log in to Harbor
        if: github.event_name != 'pull_request' || inputs.force_push
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Check if version already exists
        id: check
        run: |
          if docker manifest inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }} > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "::notice::Version ${{ steps.version.outputs.version }} already exists, skipping build"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Version ${{ steps.version.outputs.version }} does not exist, will build"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists != 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Extract metadata
        if: steps.check.outputs.exists != 'true' || github.event_name == 'workflow_dispatch'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # Push the version tag only: Harbor answers 412 to manifest reads while
      # scan-on-push runs (prevent_vul), and buildx reads the manifest back
      # for every further tag, so the rest are added after signing.
      - name: Build and push Docker image
        if: steps.check.outputs.exists != 'true' || github.event_name == 'workflow_dispatch'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: apps/log-aggregator
          file: apps/log-aggregator/Dockerfile
          # inputs.force_push is empty (not a boolean) on pull_request events;
          # compare explicitly so the expression always yields a boolean
          push: ${{ github.event_name != 'pull_request' || inputs.force_push == true }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64

      - name: Install cosign
        if: steps.build.outcome == 'success' && (github.event_name != 'pull_request' || inputs.force_push == true)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # Sign the pushed digest with the operinko-labs key (public half in
      # cosign.pub). Legacy .sig tag and no Rekor upload: Harbor lists it as a
      # signature.cosign accessory and nothing leaves the homelab. Retry while
      # scan-on-push answers 412 to the manifest read.
      - name: Sign image
        if: steps.build.outcome == 'success' && (github.event_name != 'pull_request' || inputs.force_push == true)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          for i in $(seq 1 30); do
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
              --use-signing-config=false --new-bundle-format=false --tlog-upload=false \
              "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}" && exit 0
            sleep 10
          done
          exit 1

      - name: Add remaining tags
        if: steps.build.outcome == 'success' && (github.event_name != 'pull_request' || inputs.force_push == true)
        run: |
          for tag in $(echo "${{ steps.meta.outputs.tags }}" | grep -vxF "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"); do
            for i in $(seq 1 30); do
              docker buildx imagetools create --tag "$tag" "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}" && break
              [[ $i == 30 ]] && exit 1
              sleep 10
            done
          done
