# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Renovate

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    container:
      # Bumped by the "Renovate self-update" custom manager via github-releases;
      # the docker datasource can't resolve this one - see .renovaterc.json5.
      image: ghcr.io/renovatebot/renovate:44.49.1
    steps:
      - name: Run Renovate
        env:
          RENOVATE_PLATFORM: forgejo
          RENOVATE_ENDPOINT: https://forgejo.vaderrp.com/api/v1
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          GITHUB_COM_TOKEN: ${{ secrets.GH_COM_TOKEN }}
          RENOVATE_AUTODISCOVER: "true"
          RENOVATE_GIT_AUTHOR: "Renovate Bot <renovate@vaderrp.com>"
          RENOVATE_SECRETS: '{"HARBOR_ROBOT_PASSWORD":"${{ secrets.HARBOR_ROBOT_PASSWORD }}"}'
          # Allow-list for repo-level postUpgradeTasks (gpro regenerates its pnpm
          # lockfile after npm updates — pnpm#10944 checksum workaround until its
          # .pnpmfile.cjs is deleted at TS 7.1).
          RENOVATE_ALLOWED_COMMANDS: '["pnpm install --lockfile-only"]'
          LOG_LEVEL: info
        run: renovate
