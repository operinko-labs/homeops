---
# Static config for the edge Traefik LXC (forge/apply-edge.sh installs it as
# /etc/traefik/traefik.yaml). Routes live in dynamic.yaml.j2 / routes.yaml.
global:
  checkNewVersion: false
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  # LAN, plus the UDM's WAN :443 forward (Cloudflare-proxied names). Each
  # router gets the lan-only allowlist unless routes.yaml marks it public.
  websecure:
    address: ":443"
    http:
      # traefik-warp: X-Real-IP from CF-Connecting-IP, but only when the socket
      # is in Cloudflare's ranges; everyone else keeps their socket IP. Then
      # the CrowdSec bouncer checks that IP.
      middlewares: [real-ip@file, crowdsec@file]
      tls: {}
    # warp writes X-Forwarded-For itself on every request here; without this,
    # Traefik appends the socket IP (a Cloudflare node) and apps that take the
    # last hop would see Cloudflare instead of the visitor.
    forwardedHeaders:
      notAppendXForwardedFor: true
    transport:
      respondingTimeouts:
        readTimeout: 0s
        writeTimeout: 0s
        idleTimeout: 180s
  # VPS haproxy over WireGuard (bk_forgejo_web). Only routers that list `wan`
  # are reachable here; any other Host gets Traefik's 404.
  wan:
    address: ":8443"
    # haproxy on the VPS prepends PROXY v2 (bk_forgejo_web send-proxy-v2), so
    # Traefik sees the real client instead of 172.16.8.2. Only the VPS's
    # WireGuard address may assert it.
    proxyProtocol:
      trustedIPs: ["172.16.8.2/32"]
    # No warp here: Traefik itself replaces a client-sent X-Real-Ip with the
    # (PROXY-protocol) client IP, which CrowdSec reads from the access log
    # (edge-smoke.sh real-ip-vps-spoof), and the bouncer checks.
    http:
      middlewares: [crowdsec@file]
      tls: {}
    transport:
      respondingTimeouts:
        readTimeout: 0s
        writeTimeout: 0s
        idleTimeout: 180s
  ssh:
    address: ":22"

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

experimental:
  localPlugins:
    traefikwarp:
      moduleName: github.com/l4rm4nd/traefik-warp
    traefik-oidc-auth:
      moduleName: github.com/sevensolutions/traefik-oidc-auth
    crowdsec-bouncer:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin

api:
  dashboard: true
  insecure: false

log:
  level: INFO

accessLog:
  filePath: /var/log/traefik/access.log
  format: json
  fields:
    headers:
      defaultMode: drop
      names:
        X-Real-Ip: keep
        CF-Connecting-IP: keep
        # CrowdSec's bad-user-agent and crawler scenarios need it.
        User-Agent: keep
