# Installed as /etc/crowdsec/parsers/s02-enrich/homeops-whitelist.yaml.
# Never ban the LAN, the VPS and its WireGuard link, or home's own WAN IP
# (LAN devices that resolve publicly come back through Cloudflare from it; a
# ban there would cut the whole house off the Cloudflare path). Cloudflare's
# ranges are listed only as a backstop for a parser mistake.
name: homeops/edge-whitelist
description: "LAN, VPS, home WAN IP and Cloudflare are never banned"
whitelist:
  reason: "homeops: own networks and Cloudflare"
  ip:
    - 80.223.184.52    # home WAN (Telia; vaderrp.com's A record)
    - 212.147.241.182  # the VPS itself
  cidr:
    - 192.168.0.0/16
    - 172.16.8.0/24
    # https://www.cloudflare.com/ips-v4 and ips-v6 (2026-11-19)
