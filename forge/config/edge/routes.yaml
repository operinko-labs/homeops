---
# Every host the edge Traefik LXC proxies. dynamic.yaml.j2 renders routers and
# services from this list, and forge/edge-smoke.sh tests each entry.
#   url:      backend; https:// backends with self-signed certs set insecure: true
#   expect:   HTTP status of GET / through the proxy (2026-11-18 baseline via NPMplus)
#   wan:      also served on the VPS entrypoint (:8443). Only forgejo may set this.
#   public:   reachable from outside the LAN (Cloudflare -> UDM :443 forward).
#             wan routes are public too. Everything else gets the lan-only
#             allowlist (403 from outside).
#
# Not carried over from NPMplus, so do not re-add without a reason:
#   proxmox, unifi, truenas, ilo, minio  LAN DNS resolves straight to the host
#   ruoka, bambuddy                      LAN DNS resolves to the cluster
#   nextcloud, owncloud, collabra (+ the erinko.fi pair)  no LAN record / Cloudflare
#   minio-admin, pulse                   backend gone (502)
#   npm                                  NPMplus's own UI; the dashboard replaces it
edge_routes:
  - name: tdarr
    host: tdarr.vaderrp.com
    url: "http://192.168.0.97:8265"
    expect: 200
