# Everything proxied through npmplus (LAN hostname + internet via the VPS)
# arrives from 192.168.0.5, so OpenSSH 10's PerSourcePenalties would lock out
# all proxied git traffic whenever internet bots brute-force. Global keyword:
# must stay above the Match block.
PerSourcePenaltyExemptList 192.168.0.5

# Connections proxied through npmplus (LAN hostname + internet) are git-only.
# Admin/root SSH must come direct to the LXC's LAN IP (192.168.7.30).
Match Address 192.168.0.5
    PermitRootLogin no
    AllowUsers git
    PasswordAuthentication no
