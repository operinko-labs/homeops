global
    log /dev/log local0
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

defaults
    log     global
    mode    tcp
    option  tcplog
    timeout connect 10s
    timeout client  300s
    timeout server  300s

# HTTPS / JMAP (port 443)
#frontend ft_https
#    bind :::443
#    default_backend bk_https

#backend bk_https
#    server stalwart 172.16.8.10:443

frontend ft_https
    bind :::443
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }
    # Route webmail.erinko.fi to Traefik (TLS terminated there)
    use_backend bk_traefik if { req_ssl_sni -i webmail.erinko.fi }
    # Route forgejo.vaderrp.com to npmplus (TLS terminated there)
    use_backend bk_forgejo_web if { req_ssl_sni -i forgejo.vaderrp.com }
    # Everything else goes to Stalwart (mail.erinko.fi, JMAP, etc.)
    default_backend bk_https

backend bk_https
    server stalwart 172.16.8.10:443

backend bk_traefik
    server traefik 172.16.8.11:443

backend bk_forgejo_web
    server npmplus 172.16.8.20:443

# MatrixRTC ICE/TCP fallback -> LiveKit on talos7 (UDP 30002 is nftables DNAT,
# see homeops-rtc.nft)
frontend ft_rtc_tcp
    bind :::30001
    default_backend bk_rtc_tcp

backend bk_rtc_tcp
    server livekit 172.16.8.12:30001

# Forgejo git SSH (port 22; the VPS's own sshd is on 2222)
# Forgejo only sees npmplus's IP, so per-client brute-force limiting has to
# happen here where the real source address is known.
frontend ft_forgejo_ssh
    bind :::22
    stick-table type ipv6 size 100k expire 10m store conn_rate(1m)
    tcp-request connection track-sc0 src
    tcp-request connection reject if { sc0_conn_rate gt 10 }
    default_backend bk_forgejo_ssh

backend bk_forgejo_ssh
    server npmplus 172.16.8.20:22

# Submission (port 587)
frontend ft_submission
    bind :::587
    default_backend bk_submission

backend bk_submission
    server stalwart 172.16.8.10:587

# Submissions/SMTPS (port 465)
frontend ft_submissions
    bind :::465
    default_backend bk_submissions

backend bk_submissions
    server stalwart 172.16.8.10:465

# IMAP (port 143)
frontend ft_imap
    bind :::143
    default_backend bk_imap

backend bk_imap
    server stalwart 172.16.8.10:143

# IMAPS (port 993)
frontend ft_imaps
    bind :::993
    default_backend bk_imaps

backend bk_imaps
    server stalwart 172.16.8.10:993

# ManageSieve (port 4190)
frontend ft_sieve
    bind :::4190
    default_backend bk_sieve

backend bk_sieve
    server stalwart 172.16.8.10:4190

# SMTP inbound (port 25) - with PROXY protocol for real client IP
frontend ft_smtp
    bind :::25
    default_backend bk_smtp

backend bk_smtp
    server stalwart 172.16.8.10:25 send-proxy-v2

# POP3S (port 995)
frontend ft_pop3s
    bind :::995
    default_backend bk_pop3s

backend bk_pop3s
    server stalwart 172.16.8.10:995
